name: AI Collaboration Gate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-contract:
    name: Enforce Codex + Claude collaboration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate required PR evidence fields
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          body="${PR_BODY:-}"
          required_markers=(
            "## AI collaboration evidence"
            "Correlation ID:"
            "Evidence links:"
            "Codex scope:"
            "Claude scope:"
            "Privileged operations touched:"
            "Proposal-only controls acknowledged:"
            "Protected approval workflow link:"
            "Rollback plan:"
          )

          for marker in "${required_markers[@]}"; do
            if ! grep -Fq "${marker}" <<<"${body}"; then
              echo "Missing required pull request body marker: ${marker}" >&2
              exit 1
            fi
          done

          PR_BODY_TEXT="${body}" python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          body = os.environ.get("PR_BODY_TEXT", "")
          token = os.environ["GH_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          body_lower = body.lower()
          placeholder_values = {"", "n/a", "na", "todo", "tbd", "none"}

          def api_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
                  link_header = response.headers.get("Link", "")
              return payload, link_header

          def next_page(link_header):
              for section in link_header.split(","):
                  segment = section.strip()
                  if 'rel="next"' in segment and segment.startswith("<"):
                      end_index = segment.find(">")
                      if end_index != -1:
                          return segment[1:end_index]
              return None

          def fetch_changed_files():
              files = []
              url = f"{api_url}/repos/{repository}/pulls/{pr_number}/files?per_page=100&page=1"
              while url:
                  page_files, link_header = api_get(url)
                  files.extend(page_files)
                  url = next_page(link_header)
              return files

          def extract_inline_field(label):
              match = re.search(rf"(?im)^\s*-\s*{re.escape(label)}\s*(.*)$", body)
              return "" if match is None else match.group(1).strip()

          def extract_evidence_links():
              links = []
              in_block = False
              for line in body.splitlines():
                  if re.match(r"^\s*-\s*Evidence links:\s*$", line, flags=re.IGNORECASE):
                      in_block = True
                      continue
                  if in_block and re.match(r"^\s*-\s*[A-Za-z].*:\s*$", line):
                      break
                  if not in_block:
                      continue
                  link_match = re.match(r"^\s*-\s*(.+?)\s*$", line)
                  if link_match:
                      value = link_match.group(1).strip()
                      if value:
                          links.append(value)
              return links

          def is_placeholder(value):
              return value.strip().lower() in placeholder_values

          required_inline_fields = (
              "Correlation ID:",
              "Codex scope:",
              "Claude scope:",
              "Rollback plan:",
          )
          missing_inline_fields = [
              field_name
              for field_name in required_inline_fields
              if is_placeholder(extract_inline_field(field_name))
          ]
          if missing_inline_fields:
              print(
                  "Missing required AI collaboration evidence values: "
                  + ", ".join(missing_inline_fields),
                  file=sys.stderr,
              )
              raise SystemExit(1)

          evidence_links = [
              link for link in extract_evidence_links() if not is_placeholder(link)
          ]
          if not evidence_links:
              print("Evidence links must include at least one populated value.", file=sys.stderr)
              raise SystemExit(1)
          if not any("http://" in link.lower() or "https://" in link.lower() for link in evidence_links):
              print("Evidence links must include at least one URL.", file=sys.stderr)
              raise SystemExit(1)

          files = fetch_changed_files()
          touched_files = [entry.get("filename", "") for entry in files]

          privileged_patterns = [
              r"^infra/",
              r"^monado/helios-control/infra/",
              r"^scripts/",
              r"^monado/helios-control/scripts/",
              r"^\.github/workflows/.*\.ya?ml$",
          ]

          privileged_files = [
              path
              for path in touched_files
              if any(re.search(pattern, path) for pattern in privileged_patterns)
          ]

          if privileged_files:
              required_privileged_markers = [
                  "privileged operations touched: yes",
                  "proposal-only controls acknowledged: yes",
              ]
              missing = [
                  marker for marker in required_privileged_markers if marker not in body_lower
              ]
              if missing:
                  print(
                      "Privileged file changes require explicit proposal-only acknowledgement.",
                      file=sys.stderr,
                  )
                  print(
                      "Missing markers: " + ", ".join(missing),
                      file=sys.stderr,
                  )
                  print(
                      "Privileged files:\n- " + "\n- ".join(privileged_files),
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

              protected_approval = extract_inline_field("Protected approval workflow link:")
              if is_placeholder(protected_approval):
                  print(
                      "Privileged changes require a protected approval workflow link.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

          print(f"Validated AI collaboration contract for {len(touched_files)} changed files.")
          PY
