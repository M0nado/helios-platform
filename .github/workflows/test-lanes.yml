name: Test lanes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Tests / Portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 eng/test/validate_test_ownership.py
      - run: dotnet test tests/analytics/HELIOS.Analytics.FSharp.Tests/HELIOS.Analytics.FSharp.Tests.fsproj --configuration Release

  windows:
    name: Tests / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          dotnet test tests/contracts/HELIOS.Platform.Contracts.Tests/HELIOS.Platform.Contracts.Tests.csproj --configuration Release
          dotnet test src/core/HELIOS.Platform/Phase10/Users/Tests/HELIOS.Platform.Phase10.Users.Tests.csproj --configuration Release --filter "FullyQualifiedName!~CreateDocumentFoldersAsync_ReturnsTrue&FullyQualifiedName!~CreateMediaFoldersAsync_ReturnsTrue"
          dotnet test tests/HELIOS.Platform.Tests/Phase10/Quarantine/HELIOS.Platform.Tests.Phase10.Quarantine.csproj --configuration Release
      - shell: pwsh
        continue-on-error: true
        run: |
          dotnet test tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~Performance&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~E2E&FullyQualifiedName!~Security&FullyQualifiedName!~Vault&FullyQualifiedName!~Driver&FullyQualifiedName!~Malware&FullyQualifiedName!~Deployment"
          dotnet test src/tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName!~Integration"

  privileged:
    name: Tests / Privileged
    runs-on: windows-latest
    environment: test-privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: dotnet test tests/SecurityValidationTests.csproj --configuration Release
      - shell: pwsh
        run: dotnet test src/core/HELIOS.Platform/Phase10/Users/Tests/HELIOS.Platform.Phase10.Users.Tests.csproj --configuration Release --filter "FullyQualifiedName!~CreateDocumentFoldersAsync_ReturnsTrue&FullyQualifiedName!~CreateMediaFoldersAsync_ReturnsTrue"
      - shell: pwsh
        run: dotnet test tests/HELIOS.Platform.Tests/Phase10/Quarantine/HELIOS.Platform.Tests.Phase10.Quarantine.csproj --configuration Release

  integration:
    name: Tests / Integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: dotnet test monado/helios-control/tests/Helios.Connect.Tests/Helios.Connect.Tests.csproj --configuration Release
      - shell: pwsh
        run: dotnet test src/Helios.Connect/tests/Helios.Connect.ArchitectureTests/Helios.Connect.ArchitectureTests.csproj --configuration Release
      - shell: pwsh
        continue-on-error: true
        run: |
          dotnet test tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName~Integration"
          dotnet test src/tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName~Integration"

  performance:
    name: Tests / Performance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: dotnet test tests/analytics/HELIOS.Analytics.FSharp.Tests/HELIOS.Analytics.FSharp.Tests.fsproj --configuration Release
      - shell: pwsh
        continue-on-error: true
        run: dotnet test tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName~Performance|FullyQualifiedName~ScalingTest"

  end-to-end:
    name: Tests / End-to-End
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          dotnet test tests/HELIOS.Platform.Tests/Phase10/Quarantine/HELIOS.Platform.Tests.Phase10.Quarantine.csproj --configuration Release --filter "FullyQualifiedName~HandleThreatAsync|FullyQualifiedName~HandleMultipleThreatsAsync"
          dotnet test monado/helios-control/tests/Helios.Connect.Tests/Helios.Connect.Tests.csproj --configuration Release --filter "FullyQualifiedName~SetupWizard"
      - shell: pwsh
        continue-on-error: true
        run: dotnet test tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj --configuration Release --filter "FullyQualifiedName~EndToEnd|FullyQualifiedName~E2E"
