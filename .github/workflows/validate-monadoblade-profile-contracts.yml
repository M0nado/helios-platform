name: Validate Monadoblade profile contracts (v1 + v2 + v3)

on:
  pull_request:
    paths:
      - 'config/profiles/monadoblade-profiles.v1.json'
      - 'config/profiles/monadoblade-profiles.v2.json'
      - 'config/profiles/monadoblade-profiles.migration.v1-to-v2.json'
      - 'config/storage/monadoblade-*.json'
      - 'config/software/monadoblade-profile-software.v1.json'
      - 'config/gui/monado-profile-shell.v1.json'
      - 'config/gui/monado-profile-shell.v2.json'
      - 'config/aihub/profile-optimization-policies.v1.json'
      - 'config/aihub/alvis-capabilities.v1.json'
      - 'config/automation/monadoblade-14-script-manifest.v1.json'
      - 'config/runtime/helios-fabric-services.v1.json'
      - 'config/runtime/helios-fabric-services.v2.json'
      - 'config/integrations/monadoblade-collaboration-projection.v1.json'
      - 'config/usb/monadoblade-usb-wizard.v1.json'
      - 'config/monado-enterprise/v2/**'
      - 'config/monado-enterprise/v3/**'
      - 'schemas/monado-enterprise/v2/**'
      - 'schemas/monado-enterprise/v3/**'
      - 'scripts/contracts/validate_monado_enterprise_v2.py'
      - 'scripts/contracts/validate_monadoblade_delivery_fabric_v3.py'
      - 'scripts/contracts/tests/test_validate_monado_enterprise_v2.py'
      - 'scripts/contracts/tests/test_validate_monadoblade_delivery_fabric_v3.py'
      - 'tests/contracts/HELIOS.Platform.Contracts.Tests/**'
      - 'tests/analytics/HELIOS.Analytics.FSharp.Tests/MonadoEnterpriseProfileScoringV2Tests.fs'
      - 'src/analytics/HELIOS.Analytics.FSharp/Optimization/MonadoEnterpriseProfileScoringV2.fs'
      - 'src/core/HELIOS.Platform.Contracts/MonadoEnterpriseExperienceV2Contracts.cs'
      - 'src/core/HELIOS.Platform.Contracts/MonadoBladeSixProfileDeliveryFabricV3Contracts.cs'
      - 'src/native/HELIOS.Native.Performance/include/helios/monado_enterprise_feature_extractor.hpp'
      - 'src/native/HELIOS.Native.Performance/CMakeLists.txt'
      - 'tests/native/monado_enterprise_feature_extractor_smoke.cpp'
      - 'docs/architecture/MONADOBLADE_DELIVERY_FABRIC_V2.md'
      - 'docs/WIKI/README.md'
      - 'docs/architecture/MONADOBLADE_PROFILE_STORAGE_GUI_SYSTEM.md'
      - 'docs/architecture/MONADOBLADE_SIX_PROFILE_DELIVERY_FABRIC_V3.md'
      - 'status-site/monadoblade-six-profile-delivery-fabric-v3.md'
      - '.github/workflows/validate-monadoblade-profile-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'config/profiles/monadoblade-profiles.v1.json'
      - 'config/profiles/monadoblade-profiles.v2.json'
      - 'config/profiles/monadoblade-profiles.migration.v1-to-v2.json'
      - 'config/storage/monadoblade-*.json'
      - 'config/software/monadoblade-profile-software.v1.json'
      - 'config/gui/monado-profile-shell.v1.json'
      - 'config/gui/monado-profile-shell.v2.json'
      - 'config/aihub/profile-optimization-policies.v1.json'
      - 'config/aihub/alvis-capabilities.v1.json'
      - 'config/automation/monadoblade-14-script-manifest.v1.json'
      - 'config/runtime/helios-fabric-services.v1.json'
      - 'config/runtime/helios-fabric-services.v2.json'
      - 'config/integrations/monadoblade-collaboration-projection.v1.json'
      - 'config/usb/monadoblade-usb-wizard.v1.json'
      - 'config/monado-enterprise/v2/**'
      - 'config/monado-enterprise/v3/**'
      - 'schemas/monado-enterprise/v2/**'
      - 'schemas/monado-enterprise/v3/**'
      - 'scripts/contracts/validate_monado_enterprise_v2.py'
      - 'scripts/contracts/validate_monadoblade_delivery_fabric_v3.py'
      - 'scripts/contracts/tests/test_validate_monado_enterprise_v2.py'
      - 'scripts/contracts/tests/test_validate_monadoblade_delivery_fabric_v3.py'
      - 'tests/contracts/HELIOS.Platform.Contracts.Tests/**'
      - 'tests/analytics/HELIOS.Analytics.FSharp.Tests/MonadoEnterpriseProfileScoringV2Tests.fs'
      - 'src/analytics/HELIOS.Analytics.FSharp/Optimization/MonadoEnterpriseProfileScoringV2.fs'
      - 'src/core/HELIOS.Platform.Contracts/MonadoEnterpriseExperienceV2Contracts.cs'
      - 'src/core/HELIOS.Platform.Contracts/MonadoBladeSixProfileDeliveryFabricV3Contracts.cs'
      - 'src/native/HELIOS.Native.Performance/include/helios/monado_enterprise_feature_extractor.hpp'
      - 'src/native/HELIOS.Native.Performance/CMakeLists.txt'
      - 'tests/native/monado_enterprise_feature_extractor_smoke.cpp'
      - 'docs/architecture/MONADOBLADE_DELIVERY_FABRIC_V2.md'
      - 'docs/WIKI/README.md'
      - 'docs/architecture/MONADOBLADE_PROFILE_STORAGE_GUI_SYSTEM.md'
      - 'docs/architecture/MONADOBLADE_SIX_PROFILE_DELIVERY_FABRIC_V3.md'
      - 'status-site/monadoblade-six-profile-delivery-fabric-v3.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate JSON/XML contracts and safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install schema validator
        shell: bash
        run: python -m pip install --disable-pip-version-check --upgrade jsonschema==4.23.0

      - name: Parse JSON contracts (v1 + v2 + v3)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('config/profiles/monadoblade-profiles.v1.json'),
              Path('config/profiles/monadoblade-profiles.v2.json'),
              Path('config/profiles/monadoblade-profiles.migration.v1-to-v2.json'),
              Path('config/storage/monadoblade-partitions.2x2tb.v1.json'),
              Path('config/storage/monadoblade-folder-hierarchy.v1.json'),
              Path('config/software/monadoblade-profile-software.v1.json'),
              Path('config/gui/monado-profile-shell.v1.json'),
              Path('config/gui/monado-profile-shell.v2.json'),
              Path('config/aihub/profile-optimization-policies.v1.json'),
              Path('config/aihub/alvis-capabilities.v1.json'),
              Path('config/automation/monadoblade-14-script-manifest.v1.json'),
              Path('config/runtime/helios-fabric-services.v1.json'),
              Path('config/runtime/helios-fabric-services.v2.json'),
              Path('config/integrations/monadoblade-collaboration-projection.v1.json'),
              Path('config/usb/monadoblade-usb-wizard.v1.json'),
              Path('config/monado-enterprise/v2/index.json'),
              Path('config/monado-enterprise/v2/storage.contract.v2.json'),
              Path('config/monado-enterprise/v2/profiles.contract.v2.json'),
              Path('config/monado-enterprise/v2/experience.contract.v2.json'),
              Path('config/monado-enterprise/v2/synchronization.contract.v2.json'),
              Path('config/monado-enterprise/v2/repository-map.contract.v2.json'),
              Path('config/monado-enterprise/v3/index.json'),
              Path('config/monado-enterprise/v3/profiles.contract.v3.json'),
              Path('config/monado-enterprise/v3/experience.contract.v3.json'),
              Path('config/monado-enterprise/v3/storage.contract.v3.json'),
              Path('config/monado-enterprise/v3/integration-projection.contract.v3.json'),
              Path('config/monado-enterprise/v3/repository-map.contract.v3.json'),
              Path('config/monado-enterprise/v3/libraries.contract.v3.json'),
              Path('config/monado-enterprise/v3/migration-map.contract.v3.json'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing required contract: {path}')
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid json: {path}')
          PY

      - name: Enforce v1 profile invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/profiles/monadoblade-profiles.v1.json').read_text(encoding='utf-8'))
          profiles = data['profiles']
          ids = [p['id'] for p in profiles]
          expected = {'developer', 'sysadmin', 'sysops', 'gamer', 'studio', 'personal', 'server-background'}
          if set(ids) != expected:
              raise SystemExit(f'Profile set mismatch: {set(ids)}')
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate profile IDs')
          admins = [p for p in profiles if p.get('admin')]
          if [p['id'] for p in admins] != ['sysadmin']:
              raise SystemExit('SysAdmin must be the only administrator profile')
          sysadmin = admins[0]
          activation = sysadmin.get('activation', {})
          required = ['physicalPresenceRequired', 'remoteActivationDenied', 'cloudActivationDenied', 'aiActivationDenied']
          if not all(activation.get(key) is True for key in required):
              raise SystemExit('SysAdmin physical/local activation boundary is incomplete')
          if activation.get('minimumFactors', 0) < 2:
              raise SystemExit('SysAdmin requires at least two local factors')
          print('v1 profile invariants passed')
          PY

      - name: Enforce six-profile delivery-fabric invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          six = json.loads(Path('config/profiles/monadoblade-profiles.v2.json').read_text(encoding='utf-8'))
          profiles = six['profiles']
          ids = [p['id'] for p in profiles]
          expected = ['core', 'developer', 'studio', 'gamer', 'ai-server', 'sysadmin-offline']
          if ids != expected:
              raise SystemExit(f'v2 profile sequence mismatch: {ids}')
          if six.get('defaultProfile') != 'core':
              raise SystemExit('v2 default profile must be core')

          by_id = {p['id']: p for p in profiles}
          for profile_id, kanji in {
              'core': '核',
              'developer': '創',
              'studio': '響',
              'gamer': '迅',
              'ai-server': '智',
              'sysadmin-offline': '統',
          }.items():
              if by_id[profile_id].get('kanji') != kanji:
                  raise SystemExit(f'v2 kanji mismatch for {profile_id}')

          admin = by_id['sysadmin-offline']
          activation = admin.get('activation', {})
          required = ['physicalPresenceRequired', 'remoteActivationDenied', 'cloudActivationDenied', 'aiActivationDenied', 'offlineOnly']
          if not all(activation.get(key) is True for key in required):
              raise SystemExit('sysadmin-offline activation boundary incomplete')
          if activation.get('minimumFactors', 0) < 2:
              raise SystemExit('sysadmin-offline requires at least two local factors')

          migration = json.loads(Path('config/profiles/monadoblade-profiles.migration.v1-to-v2.json').read_text(encoding='utf-8'))
          map_v1_to_v2 = migration['mapV1ToV2']
          required_mappings = {
              'developer': 'developer',
              'sysadmin': 'sysadmin-offline',
              'sysops': 'ai-server',
              'gamer': 'gamer',
              'studio': 'studio',
              'personal': 'core',
              'server-background': 'ai-server',
          }
          if map_v1_to_v2 != required_mappings:
              raise SystemExit(f'Unexpected v1->v2 mapping: {map_v1_to_v2}')

          shell = json.loads(Path('config/gui/monado-profile-shell.v2.json').read_text(encoding='utf-8'))
          chain = shell.get('postAuthStateMachine', [])
          if chain != ['safe-boot', 'identity-verified', 'wheel-ready', 'profile-selected', 'shell-ready']:
              raise SystemExit(f'Unexpected shell post-auth chain: {chain}')
          if shell['securityBoundary'].get('runsAfterWindowsAuthentication') is not True:
              raise SystemExit('Shell v2 must be post-auth only')

          usb = json.loads(Path('config/usb/monadoblade-usb-wizard.v1.json').read_text(encoding='utf-8'))
          if usb.get('defaultMode') != 'dry-run':
              raise SystemExit('USB wizard must default to dry-run')
          if usb['routes'].get('inventory') != 'read-only':
              raise SystemExit('USB wizard inventory route must be read-only')
          if usb['boundaries'].get('recoveryWorkflowProfile') != 'sysadmin-offline':
              raise SystemExit('Recovery workflow must remain sysadmin-offline')
          if usb['boundaries'].get('quarantineWorkflowProfile') != 'sysadmin-offline':
              raise SystemExit('Quarantine workflow must remain sysadmin-offline')

          alvis = json.loads(Path('config/aihub/alvis-capabilities.v1.json').read_text(encoding='utf-8'))
          if alvis['capabilities'].get('search') != ['search_*', 'fetch_*']:
              raise SystemExit('ALVIS search/fetch capabilities must remain read-only verbs')
          if alvis['capabilities'].get('plan') != ['plan_*']:
              raise SystemExit('ALVIS plan capability must remain plan-only')
          if alvis['capabilities'].get('request') != ['request_*']:
              raise SystemExit('ALVIS request capability must remain approval-pending')
          if alvis.get('directExecutorToolsDenied') is not True:
              raise SystemExit('ALVIS direct executor tools must be denied')

          projection = json.loads(Path('config/integrations/monadoblade-collaboration-projection.v1.json').read_text(encoding='utf-8'))
          if projection.get('sourceOfTruth') != 'github':
              raise SystemExit('Integration projection source of truth must be GitHub')
          if projection.get('allowExecutionFromProjectedSystems') is not False:
              raise SystemExit('Projected systems cannot trigger execution')
          print('six-profile delivery-fabric invariants passed')
          PY

      - name: Enforce v1 storage guardrails
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/storage/monadoblade-partitions.2x2tb.v1.json').read_text(encoding='utf-8'))
          if data.get('destructiveApplyDefault') is not False:
              raise SystemExit('Destructive apply must default to false')
          if data.get('requireWhatIf') is not True:
              raise SystemExit('Storage layout must require what-if')
          guardrails = data.get('guardrails', {})
          required = [
              'neverClearDiskWithoutExactIdentity',
              'neverFormatSystemOrBootDisk',
              'neverDeleteOemRecoveryAutomatically',
              'requireBackupEvidenceBeforeApply',
              'requireBitLockerRecoveryEvidence',
          ]
          if not all(guardrails.get(key) is True for key in required):
              raise SystemExit('Storage guardrails are incomplete')
          workload = next(d for d in data['disks'] if d['diskRole'] == 'workload')
          labels = {p['label'] for p in workload['partitions']}
          expected = {'MONADO_DEV', 'MONADO_AI_MODELS', 'MONADO_SECURE', 'MONADO_QUARANTINE', 'MONADO_BACKUP'}
          if labels != expected:
              raise SystemExit(f'Workload volume mismatch: {labels}')
          print('v1 storage invariants passed')
          PY

      - name: Enforce v1 AIHub and automation safety
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          aihub = json.loads(Path('config/aihub/profile-optimization-policies.v1.json').read_text(encoding='utf-8'))
          brain = aihub['brain']
          required_brain = [
              'denySecretReadback',
              'denyUnboundedShell',
              'denySelfPrivilegeEscalation',
              'requireHumanApprovalForExternalWrites',
          ]
          if brain.get('autonomousAdministrator') is not False:
              raise SystemExit('AIHub cannot be an autonomous administrator')
          if not all(brain.get(key) is True for key in required_brain):
              raise SystemExit('AIHub safety invariants are incomplete')

          automation = json.loads(Path('config/automation/monadoblade-14-script-manifest.v1.json').read_text(encoding='utf-8'))
          scripts = automation['scripts']
          if len(scripts) != 14:
              raise SystemExit(f'Expected 14 governed scripts, found {len(scripts)}')
          if automation.get('rawExecutionDenied') is not True:
              raise SystemExit('Raw script execution must be denied')
          if automation.get('defaultMode') != 'plan':
              raise SystemExit('Automation must default to plan mode')
          if not all('risk' in item and 'applyRequires' in item for item in scripts):
              raise SystemExit('Every script must declare risk and apply gates')
          print('v1 AIHub and automation invariants passed')
          PY

      - name: Validate v2 + v3 JSON schema pairs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          pairs = [
              ('schemas/monado-enterprise/v2/index.schema.json', 'config/monado-enterprise/v2/index.json'),
              ('schemas/monado-enterprise/v2/storage.contract.v2.schema.json', 'config/monado-enterprise/v2/storage.contract.v2.json'),
              ('schemas/monado-enterprise/v2/profiles.contract.v2.schema.json', 'config/monado-enterprise/v2/profiles.contract.v2.json'),
              ('schemas/monado-enterprise/v2/experience.contract.v2.schema.json', 'config/monado-enterprise/v2/experience.contract.v2.json'),
              ('schemas/monado-enterprise/v2/synchronization.contract.v2.schema.json', 'config/monado-enterprise/v2/synchronization.contract.v2.json'),
              ('schemas/monado-enterprise/v2/repository-map.contract.v2.schema.json', 'config/monado-enterprise/v2/repository-map.contract.v2.json'),
              ('schemas/monado-enterprise/v3/index.schema.json', 'config/monado-enterprise/v3/index.json'),
              ('schemas/monado-enterprise/v3/profiles.contract.v3.schema.json', 'config/monado-enterprise/v3/profiles.contract.v3.json'),
              ('schemas/monado-enterprise/v3/experience.contract.v3.schema.json', 'config/monado-enterprise/v3/experience.contract.v3.json'),
              ('schemas/monado-enterprise/v3/storage.contract.v3.schema.json', 'config/monado-enterprise/v3/storage.contract.v3.json'),
              ('schemas/monado-enterprise/v3/integration-projection.contract.v3.schema.json', 'config/monado-enterprise/v3/integration-projection.contract.v3.json'),
              ('schemas/monado-enterprise/v3/repository-map.contract.v3.schema.json', 'config/monado-enterprise/v3/repository-map.contract.v3.json'),
              ('schemas/monado-enterprise/v3/libraries.contract.v3.schema.json', 'config/monado-enterprise/v3/libraries.contract.v3.json'),
              ('schemas/monado-enterprise/v3/migration-map.contract.v3.schema.json', 'config/monado-enterprise/v3/migration-map.contract.v3.json'),
          ]

          for schema_path, document_path in pairs:
              schema = json.loads(Path(schema_path).read_text(encoding='utf-8'))
              document = json.loads(Path(document_path).read_text(encoding='utf-8'))
              if isinstance(document, dict):
                  document = {k: v for k, v in document.items() if k != '$schema'}
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(document)
              print(f'schema ok: {document_path}')
          PY

      - name: Validate v2 dependency-free invariants
        shell: bash
        run: |
          python scripts/contracts/validate_monado_enterprise_v2.py
          python -m unittest discover -s scripts/contracts/tests -p "test_validate_monado_enterprise_v2.py" -v

      - name: Validate v3 dependency-free invariants
        shell: bash
        run: |
          python scripts/contracts/validate_monadoblade_delivery_fabric_v3.py
          python -m unittest discover -s scripts/contracts/tests -p "test_validate_monadoblade_delivery_fabric_v3.py" -v

      - name: Run C# v2 contract tests
        shell: bash
        run: dotnet test tests/contracts/HELIOS.Platform.Contracts.Tests/HELIOS.Platform.Contracts.Tests.csproj --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Run F# bounded scoring tests
        shell: bash
        run: dotnet test tests/analytics/HELIOS.Analytics.FSharp.Tests/HELIOS.Analytics.FSharp.Tests.fsproj --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Run C++20 read-only extraction smoke tests
        shell: bash
        run: |
          cmake -S src/native/HELIOS.Native.Performance -B build/native -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
          ctest --test-dir build/native --build-config Release --output-on-failure

      - name: Secret-pattern scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('config'), Path('docs/architecture'), Path('schemas/monado-enterprise/v2'), Path('schemas/monado-enterprise/v3')]
          patterns = [
              re.compile(r'(?<![A-Za-z0-9_])sk-[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])'),
              re.compile(r'(?<![A-Za-z0-9_])github_pat_[A-Za-z0-9_]{20,}(?![A-Za-z0-9_])'),
              re.compile(r'(?i)(client_secret|api_key|access_token)\s*[:=]\s*["\'][^"\']{12,}["\']'),
          ]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for pattern in patterns:
                      if pattern.search(text):
                          raise SystemExit(f'Potential secret in {path}: {pattern.pattern}')
          print('no secret patterns detected')
          PY
