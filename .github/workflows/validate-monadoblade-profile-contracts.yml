name: Validate Monadoblade profile contracts

on:
  pull_request:
    paths:
      - 'config/profiles/monadoblade-profiles.v1.json'
      - 'config/profiles/monadoblade-profiles.v2.json'
      - 'config/profiles/monadoblade-profiles.migration.v1-to-v2.json'
      - 'config/storage/monadoblade-*.json'
      - 'config/software/monadoblade-profile-software.v1.json'
      - 'config/gui/monado-profile-shell.v1.json'
      - 'config/gui/monado-profile-shell.v2.json'
      - 'config/aihub/profile-optimization-policies.v1.json'
      - 'config/aihub/alvis-capabilities.v1.json'
      - 'config/automation/monadoblade-14-script-manifest.v1.json'
      - 'config/runtime/helios-fabric-services.v1.json'
      - 'config/runtime/helios-fabric-services.v2.json'
      - 'config/integrations/monadoblade-collaboration-projection.v1.json'
      - 'config/usb/monadoblade-usb-wizard.v1.json'
      - 'docs/architecture/MONADOBLADE_DELIVERY_FABRIC_V2.md'
      - 'docs/WIKI/README.md'
      - 'docs/WIKI/INDEX.md'
      - 'docs/architecture/MONADOBLADE_PROFILE_STORAGE_GUI_SYSTEM.md'
      - 'scripts/utilities/wiki/generate-wiki.ps1'
      - '.github/workflows/validate-monadoblade-profile-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'config/profiles/monadoblade-profiles.v1.json'
      - 'config/profiles/monadoblade-profiles.v2.json'
      - 'config/profiles/monadoblade-profiles.migration.v1-to-v2.json'
      - 'config/storage/monadoblade-*.json'
      - 'config/software/monadoblade-profile-software.v1.json'
      - 'config/gui/monado-profile-shell.v1.json'
      - 'config/gui/monado-profile-shell.v2.json'
      - 'config/aihub/profile-optimization-policies.v1.json'
      - 'config/aihub/alvis-capabilities.v1.json'
      - 'config/automation/monadoblade-14-script-manifest.v1.json'
      - 'config/runtime/helios-fabric-services.v1.json'
      - 'config/runtime/helios-fabric-services.v2.json'
      - 'config/integrations/monadoblade-collaboration-projection.v1.json'
      - 'config/usb/monadoblade-usb-wizard.v1.json'
      - 'docs/architecture/MONADOBLADE_DELIVERY_FABRIC_V2.md'
      - 'docs/WIKI/README.md'
      - 'docs/WIKI/INDEX.md'
      - 'docs/architecture/MONADOBLADE_PROFILE_STORAGE_GUI_SYSTEM.md'
      - 'scripts/utilities/wiki/generate-wiki.ps1'
      - '.github/workflows/validate-monadoblade-profile-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate JSON and safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse JSON contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('config/profiles/monadoblade-profiles.v1.json'),
              Path('config/profiles/monadoblade-profiles.v2.json'),
              Path('config/profiles/monadoblade-profiles.migration.v1-to-v2.json'),
              Path('config/storage/monadoblade-partitions.2x2tb.v1.json'),
              Path('config/storage/monadoblade-folder-hierarchy.v1.json'),
              Path('config/software/monadoblade-profile-software.v1.json'),
              Path('config/gui/monado-profile-shell.v1.json'),
              Path('config/gui/monado-profile-shell.v2.json'),
              Path('config/aihub/profile-optimization-policies.v1.json'),
              Path('config/aihub/alvis-capabilities.v1.json'),
              Path('config/automation/monadoblade-14-script-manifest.v1.json'),
              Path('config/runtime/helios-fabric-services.v1.json'),
              Path('config/runtime/helios-fabric-services.v2.json'),
              Path('config/integrations/monadoblade-collaboration-projection.v1.json'),
              Path('config/usb/monadoblade-usb-wizard.v1.json'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing required contract: {path}')
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid: {path}')
          PY

      - name: Enforce profile invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/profiles/monadoblade-profiles.v1.json').read_text(encoding='utf-8'))
          profiles = data['profiles']
          ids = [p['id'] for p in profiles]
          expected = {'developer', 'sysadmin', 'sysops', 'gamer', 'studio', 'personal', 'server-background'}
          if set(ids) != expected:
              raise SystemExit(f'Profile set mismatch: {set(ids)}')
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate profile IDs')
          admins = [p for p in profiles if p.get('admin')]
          if [p['id'] for p in admins] != ['sysadmin']:
              raise SystemExit('SysAdmin must be the only administrator profile')
          sysadmin = admins[0]
          activation = sysadmin.get('activation', {})
          required = ['physicalPresenceRequired', 'remoteActivationDenied', 'cloudActivationDenied', 'aiActivationDenied']
          if not all(activation.get(key) is True for key in required):
              raise SystemExit('SysAdmin physical/local activation boundary is incomplete')
          if activation.get('minimumFactors', 0) < 2:
              raise SystemExit('SysAdmin requires at least two local factors')
          print('profile invariants passed')
          PY

      - name: Enforce six-profile delivery-fabric invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          six = json.loads(Path('config/profiles/monadoblade-profiles.v2.json').read_text(encoding='utf-8'))
          profiles = six['profiles']
          ids = [p['id'] for p in profiles]
          expected = ['core', 'developer', 'studio', 'gamer', 'ai-server', 'sysadmin-offline']
          if ids != expected:
              raise SystemExit(f'v2 profile sequence mismatch: {ids}')
          if six.get('defaultProfile') != 'core':
              raise SystemExit('v2 default profile must be core')

          by_id = {p['id']: p for p in profiles}
          for profile_id, kanji in {
              'core': '核',
              'developer': '創',
              'studio': '響',
              'gamer': '迅',
              'ai-server': '智',
              'sysadmin-offline': '統',
          }.items():
              if by_id[profile_id].get('kanji') != kanji:
                  raise SystemExit(f'v2 kanji mismatch for {profile_id}')

          admin = by_id['sysadmin-offline']
          activation = admin.get('activation', {})
          required = ['physicalPresenceRequired', 'remoteActivationDenied', 'cloudActivationDenied', 'aiActivationDenied', 'offlineOnly']
          if not all(activation.get(key) is True for key in required):
              raise SystemExit('sysadmin-offline activation boundary incomplete')
          if activation.get('minimumFactors', 0) < 2:
              raise SystemExit('sysadmin-offline requires at least two local factors')

          ai_server_bundles = set(by_id['ai-server'].get('softwareBundles', []))
          required_ai_server_bundles = {
              'common-core',
              'sysops-security',
              'sysops-observability',
              'sysops-cloud',
              'sysops-performance',
              'server-runtime',
              'server-containers',
              'server-observability',
              'server-security',
              'server-ai-workers',
          }
          missing_bundles = sorted(required_ai_server_bundles - ai_server_bundles)
          if missing_bundles:
              raise SystemExit(f'AI/Server software bundle set is incomplete: {missing_bundles}')
          ai_server_roots = set(by_id['ai-server'].get('roots', []))
          required_ai_server_roots = {
              'server',
              'models-service',
              'telemetry',
              'backups-service',
              'server-ops',
              'dev-read',
              'common',
              'crosspartition',
              'quarantine-read',
          }
          missing_roots = sorted(required_ai_server_roots - ai_server_roots)
          if missing_roots:
              raise SystemExit(f'AI/Server roots must retain SysOps and ServerBackground access: {missing_roots}')
          for profile_id in expected:
              resource_policy = by_id[profile_id].get('resourcePolicy')
              if not isinstance(resource_policy, dict):
                  raise SystemExit(f'{profile_id} must define a resourcePolicy object in v2')
          expected_ai_server_resource_policy = {
              'cpuMode': 'observability-responsive',
              'gpuMode': 'worker-scheduled',
              'memoryReserveGb': 10,
              'containerBudgetGb': 48,
              'vmBudgetGb': 48,
              'modelBudgetGb': 32,
              'backgroundPriority': 'service-controlled',
          }
          if by_id['ai-server'].get('resourcePolicy') != expected_ai_server_resource_policy:
              raise SystemExit('AI/Server v2 resourcePolicy must match deterministic merged budgets')

          migration = json.loads(Path('config/profiles/monadoblade-profiles.migration.v1-to-v2.json').read_text(encoding='utf-8'))
          map_v1_to_v2 = migration['mapV1ToV2']
          required_mappings = {
              'developer': 'developer',
              'sysadmin': 'sysadmin-offline',
              'sysops': 'ai-server',
              'gamer': 'gamer',
              'studio': 'studio',
              'personal': 'core',
              'server-background': 'ai-server',
          }
          if map_v1_to_v2 != required_mappings:
              raise SystemExit(f'Unexpected v1->v2 mapping: {map_v1_to_v2}')

          legacy_surfaces = migration.get('legacySurfaceContracts', {})
          required_legacy_surfaces = {
              'software': 'config/software/monadoblade-profile-software.v1.json',
              'aihubPolicy': 'config/aihub/profile-optimization-policies.v1.json',
              'storagePartitions': 'config/storage/monadoblade-partitions.2x2tb.v1.json',
              'storageHierarchy': 'config/storage/monadoblade-folder-hierarchy.v1.json',
              'shellV1': 'config/gui/monado-profile-shell.v1.json',
          }
          if legacy_surfaces != required_legacy_surfaces:
              raise SystemExit(f'Unexpected legacy surface contract map: {legacy_surfaces}')
          for path in legacy_surfaces.values():
              if not Path(path).exists():
                  raise SystemExit(f'Missing legacy surface contract: {path}')

          surface_mappings = migration.get('surfaceMappings', {})
          required_surface_keys = {'softwareScopes', 'aihubPolicies', 'guiThemes', 'storageWorkspaces', 'resourcePolicies'}
          if set(surface_mappings.keys()) != required_surface_keys:
              raise SystemExit(f'Unexpected migration surface keys: {set(surface_mappings.keys())}')
          expected_set = set(expected)
          for key in required_surface_keys:
              profile_map = surface_mappings.get(key)
              if not isinstance(profile_map, dict):
                  raise SystemExit(f'{key} must be a profile-to-legacy mapping object')
              if set(profile_map.keys()) != expected_set:
                  raise SystemExit(f'{key} must map every v2 profile: {set(profile_map.keys())}')
          if surface_mappings['softwareScopes']['core'] != ['personal']:
              raise SystemExit('core software scope migration must map from personal')
          if surface_mappings['softwareScopes']['ai-server'] != ['sysops', 'server-background']:
              raise SystemExit('ai-server software scope migration must include sysops and server-background')
          if surface_mappings['softwareScopes']['sysadmin-offline'] != ['sysadmin']:
              raise SystemExit('sysadmin-offline software scope migration must map from sysadmin')
          if surface_mappings['resourcePolicies']['ai-server'] != ['sysops', 'server-background']:
              raise SystemExit('ai-server resource policy migration must include sysops and server-background')

          resolution = migration.get('deterministicResolution', {})
          ai_server_aihub = resolution.get('aihubPolicies', {}).get('ai-server', {})
          if ai_server_aihub.get('strategy') != 'field-level-union':
              raise SystemExit('AI/Server aihubPolicies resolution must use field-level-union')
          if ai_server_aihub.get('sources') != ['sysops', 'server-background']:
              raise SystemExit('AI/Server aihubPolicies must merge sysops and server-background')
          if ai_server_aihub.get('unionFields') != ['primaryObjectives', 'learningSignals', 'automaticActions', 'approvalActions']:
              raise SystemExit('AI/Server aihubPolicies union fields are not deterministic')
          if ai_server_aihub.get('precedenceForConflictScalars') != ['sysops', 'server-background']:
              raise SystemExit('AI/Server aihubPolicies precedence must remain deterministic')
          if ai_server_aihub.get('requireApprovalActions') != ['service-restart', 'rollback', 'external-message', 'data-removal']:
              raise SystemExit('AI/Server aihubPolicies must preserve both SysOps and ServerBackground approval gates')
          ai_server_gui = resolution.get('guiThemes', {}).get('ai-server', {})
          if ai_server_gui.get('strategy') != 'precedence-merge':
              raise SystemExit('AI/Server guiThemes resolution must use precedence-merge')
          if ai_server_gui.get('primarySource') != 'sysops':
              raise SystemExit('AI/Server guiThemes primary source must be sysops')
          if ai_server_gui.get('secondarySource') != 'server-background':
              raise SystemExit('AI/Server guiThemes secondary source must be server-background')
          if ai_server_gui.get('scalarFieldsFromPrimary') != ['backgroundVariant', 'panelStyle', 'density']:
              raise SystemExit('AI/Server guiThemes scalar precedence is not deterministic')

          sysadmin_workspace = resolution.get('storageWorkspaces', {}).get('sysadmin-offline', {})
          if sysadmin_workspace.get('source') != 'SysAdmin':
              raise SystemExit('sysadmin-offline storage workspace source must be SysAdmin')
          if sysadmin_workspace.get('requiresManagedRootPath') != '04_ProfileWorkspaces/SysAdmin':
              raise SystemExit('sysadmin-offline storage workspace path requirement is missing')
          ai_server_resource_resolution = resolution.get('resourcePolicies', {}).get('ai-server', {})
          if ai_server_resource_resolution.get('strategy') != 'field-level-merge':
              raise SystemExit('AI/Server resource policy resolution must use field-level-merge')
          if ai_server_resource_resolution.get('sources') != ['sysops', 'server-background']:
              raise SystemExit('AI/Server resource policy sources must include sysops and server-background')
          if ai_server_resource_resolution.get('scalarPrecedence') != {
              'cpuMode': 'sysops',
              'gpuMode': 'server-background',
              'backgroundPriority': 'server-background',
          }:
              raise SystemExit('AI/Server resource policy scalar precedence is not deterministic')
          if ai_server_resource_resolution.get('numericMerge') != {
              'memoryReserveGb': 'max',
              'containerBudgetGb': 'max',
              'vmBudgetGb': 'max',
              'modelBudgetGb': 'max',
          }:
              raise SystemExit('AI/Server resource policy numeric merge rules are incomplete')
          if ai_server_resource_resolution.get('materializedPolicy') != expected_ai_server_resource_policy:
              raise SystemExit('AI/Server resource policy materialized result must match the v2 contract')

          hierarchy = json.loads(Path('config/storage/monadoblade-folder-hierarchy.v1.json').read_text(encoding='utf-8'))
          dev_roots = hierarchy['managedRoots']['MONADO_DEV']
          secure_roots = hierarchy['managedRoots']['MONADO_SECURE']
          if '04_ProfileWorkspaces/SysAdmin' not in dev_roots:
              raise SystemExit('MONADO_DEV must include 04_ProfileWorkspaces/SysAdmin')
          if '02_ProfileData/SysAdmin' not in secure_roots:
              raise SystemExit('MONADO_SECURE must include 02_ProfileData/SysAdmin')

          shell = json.loads(Path('config/gui/monado-profile-shell.v2.json').read_text(encoding='utf-8'))
          chain = shell.get('postAuthStateMachine', [])
          if chain != ['safe-boot', 'identity-verified', 'wheel-ready', 'profile-selected', 'readiness-check', 'shell-ready']:
              raise SystemExit(f'Unexpected shell post-auth chain: {chain}')
          if shell['securityBoundary'].get('runsAfterWindowsAuthentication') is not True:
              raise SystemExit('Shell v2 must be post-auth only')
          guard_requirements = [
              'identityVerifiedRequiredBeforeWheel',
              'sysadminRequiresLocalOfflineAuthorization',
              'profilePolicyValidatedBeforeShellReady',
              'managedVolumesOnlineBeforeShellReady',
              'requiredServicesHealthyBeforeShellReady',
              'firewallPolicyLoadedBeforeShellReady',
              'safeNeutralOnGuardFailure',
          ]
          if not all(shell.get('stateGuards', {}).get(key) is True for key in guard_requirements):
              raise SystemExit('Shell v2 readiness guard requirements are incomplete')
          if shell.get('stateGuards', {}).get('readinessFailureState') != 'safe-neutral':
              raise SystemExit('Shell v2 readiness failures must route to safe-neutral')
          if shell.get('readinessChecks') != [
              'profile-policy-valid',
              'required-volumes-online',
              'required-services-healthy',
              'firewall-policy-loaded',
          ]:
              raise SystemExit(f'Unexpected shell v2 readiness checks: {shell.get("readinessChecks")}')

          runtime = json.loads(Path('config/runtime/helios-fabric-services.v2.json').read_text(encoding='utf-8'))
          if runtime.get('inheritsFrom') != 'config/runtime/helios-fabric-services.v1.json':
              raise SystemExit('Runtime v2 must declare v1 inheritance for continuity')
          if not Path(runtime['inheritsFrom']).exists():
              raise SystemExit(f'Runtime v2 inheritance contract is missing: {runtime["inheritsFrom"]}')
          if runtime.get('defaultTransport') != 'local-grpc':
              raise SystemExit('Runtime v2 default transport must remain local-grpc')
          if not runtime.get('services'):
              raise SystemExit('Runtime v2 must retain a non-empty service graph')
          required_message_requirements = [
              'typedContracts',
              'correlationId',
              'causationId',
              'idempotencyKey',
              'profileId',
              'securityClassification',
              'schemaVersion',
              'createdAtUtc',
              'evidenceReference',
              'secretValuesDenied',
          ]
          message_requirements = runtime.get('messageRequirements', {})
          if not all(message_requirements.get(key) is True for key in required_message_requirements):
              raise SystemExit('Runtime v2 message requirements are incomplete')
          required_auth_requirements = [
              'denyByDefault',
              'managedIdentityInAzure',
              'localServiceIdentityOnWindows',
              'perToolPolicy',
              'perProfilePolicy',
              'externalWritesNeedApproval',
              'productionNeedsProtectedEnvironment',
              'sysAdminNeedsPhysicalTwoFactor',
          ]
          auth = runtime.get('authorization', {})
          if not all(auth.get(key) is True for key in required_auth_requirements):
              raise SystemExit('Runtime v2 authorization requirements are incomplete')
          expected_profile_contracts = {
              'active': 'config/profiles/monadoblade-profiles.v2.json',
              'legacyInput': 'config/profiles/monadoblade-profiles.v1.json',
              'migration': 'config/profiles/monadoblade-profiles.migration.v1-to-v2.json',
          }
          if runtime.get('profileContracts') != expected_profile_contracts:
              raise SystemExit(f'Unexpected runtime profile contract links: {runtime.get("profileContracts")}')
          surface_contracts = runtime.get('surfaceContracts', {})
          for key in ('shell', 'usbWizard', 'alvisCapabilities', 'integrationProjection'):
              path = surface_contracts.get(key)
              if not path:
                  raise SystemExit(f'Runtime surface contract missing key: {key}')
              if not Path(path).exists():
                  raise SystemExit(f'Runtime surface contract path missing: {path}')

          usb = json.loads(Path('config/usb/monadoblade-usb-wizard.v1.json').read_text(encoding='utf-8'))
          if usb.get('defaultMode') != 'dry-run':
              raise SystemExit('USB wizard must default to dry-run')
          if usb['routes'].get('inventory') != 'read-only':
              raise SystemExit('USB wizard inventory route must be read-only')
          if usb['routes'].get('apply') != 'approval-gated-storage-guardrails':
              raise SystemExit('USB wizard apply route must enforce storage guardrails')
          apply = usb.get('applyRequirements', {})
          if apply.get('storageContract') != 'config/storage/monadoblade-partitions.2x2tb.v1.json':
              raise SystemExit('USB wizard apply must bind to the storage layout contract')
          for key in (
              'requireWhatIf',
              'requirePhysicalAuthorization',
              'requireBackupEvidenceBeforeApply',
              'requireBitLockerRecoveryEvidence',
              'requireRollbackNotes',
              'requireExactDiskIdentity',
          ):
              if apply.get(key) is not True:
                  raise SystemExit(f'USB wizard apply requirement missing: {key}')
          if apply.get('requiredConfirmationPhrase') != 'APPLY MONADOBLADE STORAGE LAYOUT':
              raise SystemExit('USB wizard apply confirmation phrase must match storage guardrails')
          if usb['boundaries'].get('recoveryWorkflowProfile') != 'sysadmin-offline':
              raise SystemExit('Recovery workflow must remain sysadmin-offline')
          if usb['boundaries'].get('quarantineWorkflowProfile') != 'sysadmin-offline':
              raise SystemExit('Quarantine workflow must remain sysadmin-offline')

          alvis = json.loads(Path('config/aihub/alvis-capabilities.v1.json').read_text(encoding='utf-8'))
          if alvis['capabilities'].get('search') != ['search_*', 'fetch_*']:
              raise SystemExit('ALVIS search/fetch capabilities must remain read-only verbs')
          if alvis['capabilities'].get('plan') != ['plan_*']:
              raise SystemExit('ALVIS plan capability must remain plan-only')
          if alvis['capabilities'].get('request') != ['request_*']:
              raise SystemExit('ALVIS request capability must remain approval-pending')
          if alvis.get('directExecutorToolsDenied') is not True:
              raise SystemExit('ALVIS direct executor tools must be denied')

          projection = json.loads(Path('config/integrations/monadoblade-collaboration-projection.v1.json').read_text(encoding='utf-8'))
          if projection.get('sourceOfTruth') != 'github':
              raise SystemExit('Integration projection source of truth must be GitHub')
          if projection.get('eventContractSchema') != 'config/integrations/event-contract.schema.json':
              raise SystemExit('Integration projection must pin the normalized event-contract schema')
          schema_path = Path(projection['eventContractSchema'])
          if not schema_path.exists():
              raise SystemExit(f'Referenced integration event schema is missing: {schema_path}')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema_properties = schema.get('properties', {})
          schema_required = schema.get('required', [])
          projection_required = projection.get('requiredEnvelopeFields', [])
          if not isinstance(projection_required, list) or not projection_required:
              raise SystemExit('Integration projection requiredEnvelopeFields must be a non-empty list')
          if len(projection_required) != len(set(projection_required)):
              raise SystemExit('Integration projection requiredEnvelopeFields cannot contain duplicates')
          missing_schema_required = sorted(set(schema_required) - set(projection_required))
          if missing_schema_required:
              raise SystemExit(f'Projection is missing schema-required envelope fields: {missing_schema_required}')
          unknown_projection_fields = sorted(set(projection_required) - set(schema_properties))
          if unknown_projection_fields:
              raise SystemExit(f'Projection requires fields not defined by schema: {unknown_projection_fields}')
          if projection.get('requireSchemaValidationBeforeProjection') is not True:
              raise SystemExit('Integration projection must require schema validation before projection')
          if projection.get('allowExecutionFromProjectedSystems') is not False:
              raise SystemExit('Projected systems cannot trigger execution')
          print('six-profile delivery-fabric invariants passed')
          PY

      - name: Enforce storage guardrails
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/storage/monadoblade-partitions.2x2tb.v1.json').read_text(encoding='utf-8'))
          if data.get('destructiveApplyDefault') is not False:
              raise SystemExit('Destructive apply must default to false')
          if data.get('requireWhatIf') is not True:
              raise SystemExit('Storage layout must require what-if')
          guardrails = data.get('guardrails', {})
          required = [
              'neverClearDiskWithoutExactIdentity',
              'neverFormatSystemOrBootDisk',
              'neverDeleteOemRecoveryAutomatically',
              'requireBackupEvidenceBeforeApply',
              'requireBitLockerRecoveryEvidence',
          ]
          if not all(guardrails.get(key) is True for key in required):
              raise SystemExit('Storage guardrails are incomplete')
          workload = next(d for d in data['disks'] if d['diskRole'] == 'workload')
          labels = {p['label'] for p in workload['partitions']}
          expected = {'MONADO_DEV', 'MONADO_AI_MODELS', 'MONADO_SECURE', 'MONADO_QUARANTINE', 'MONADO_BACKUP'}
          if labels != expected:
              raise SystemExit(f'Workload volume mismatch: {labels}')
          print('storage invariants passed')
          PY

      - name: Enforce AIHub and automation safety
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          aihub = json.loads(Path('config/aihub/profile-optimization-policies.v1.json').read_text(encoding='utf-8'))
          brain = aihub['brain']
          required_brain = [
              'denySecretReadback',
              'denyUnboundedShell',
              'denySelfPrivilegeEscalation',
              'requireHumanApprovalForExternalWrites',
          ]
          if brain.get('autonomousAdministrator') is not False:
              raise SystemExit('AIHub cannot be an autonomous administrator')
          if not all(brain.get(key) is True for key in required_brain):
              raise SystemExit('AIHub safety invariants are incomplete')

          automation = json.loads(Path('config/automation/monadoblade-14-script-manifest.v1.json').read_text(encoding='utf-8'))
          scripts = automation['scripts']
          if len(scripts) != 14:
