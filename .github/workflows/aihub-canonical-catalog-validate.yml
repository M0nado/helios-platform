name: AIHub Canonical Catalog Validation

on:
  pull_request:
    paths:
      - 'python/aihub/canonical_catalog.py'
      - 'python/aihub/build_canonical_artifacts.py'
      - 'python/aihub/secure_runtime/catalog_server.py'
      - 'tests/python/test_aihub_canonical_catalog.py'
      - 'tests/python/test_aihub_catalog_server.py'
      - '.github/workflows/aihub-canonical-catalog-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile canonical AIHub modules
        run: |
          python -m compileall -q \
            python/aihub/canonical_catalog.py \
            python/aihub/build_canonical_artifacts.py \
            python/aihub/secure_runtime

      - name: Run canonical catalog and API tests
        run: |
          python -m unittest -v \
            tests.python.test_aihub_canonical_catalog \
            tests.python.test_aihub_catalog_server

      - name: Build and verify deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/aihub/canonical-ci
          python -m python.aihub.build_canonical_artifacts \
            --output artifacts/aihub/canonical-ci \
            --no-cuda-enabled
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifacts/aihub/canonical-ci')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['productionEnabled'] is False
          assert manifest['cudaEnabled'] is False
          assert len(manifest['files']) == 5
          for entry in manifest['files']:
              path = root / entry['path']
              assert path.stat().st_size == entry['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256']
          assert not list(root.glob('*.tmp'))
          PY

      - name: Enforce proposal-only and no-shell contract
        shell: python
        run: |
          import re
          from pathlib import Path

          paths = [
              Path('python/aihub/canonical_catalog.py'),
              Path('python/aihub/build_canonical_artifacts.py'),
              Path('python/aihub/secure_runtime/catalog_server.py'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          for required in ['proposalOnly', 'productionEnabled', 'mutation_authority']:
              if required not in text:
                  raise SystemExit(f'Missing canonical guard: {required}')
          for pattern in [
              r'subprocess\.',
              r'os\.system\(',
              r'shell\s*=\s*True',
              r'sk-proj-[A-Za-z0-9_-]{20,}',
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
          ]:
              if re.search(pattern, text):
                  raise SystemExit(f'Forbidden catalog content: {pattern}')
