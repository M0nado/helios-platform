name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  powershell-lint:
    name: PowerShell Linting & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify PowerShell
        run: $PSVersionTable.PSVersion
        shell: pwsh
      
      - name: Install PSScriptAnalyzer
        run: |
          pwsh -Command "Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser"
      
      - name: Run PSScriptAnalyzer
        run: |
          pwsh -Command "
          \$scriptsFound = Get-ChildItem -Path './src', './scripts' -Recurse -Filter '*.ps1' -ErrorAction SilentlyContinue
          if (\$scriptsFound) {
            Invoke-ScriptAnalyzer -Path './src', './scripts' -Recurse -Severity Error, Warning -OutVariable results
            if (\$results) {
              \$results | Tee-Object -FilePath ps-analysis.txt
            }
          } else {
            Write-Host 'No PowerShell scripts found to analyze'
          }
          "
        continue-on-error: true
      
      - name: Upload Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-analysis
          path: ps-analysis.txt
          if-no-files-found: warn

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Markdown Linter
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
        continue-on-error: true

  json-validate:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate JSON files
        run: |
          error_count=0
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            echo "Validating $file"
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON: $file"
              error_count=$((error_count + 1))
            fi
          done
          
          if [ $error_count -eq 0 ]; then
            echo "✅ All JSON files valid"
          else
            echo "⚠️  Found $error_count invalid JSON files (non-blocking)"
          fi
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security scan
        uses: github/super-linter/slim@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CSHARP: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
        continue-on-error: true

  xcore-hermes-local-benchmark:
    name: XCore/Hermes Local Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile benchmark and fleet scripts
        run: |
          python3 -m py_compile \
            scripts/agents/hermes_fleet_readiness.py \
            scripts/agents/agent_fleet_control_catalog.py \
            scripts/agents/agent_fleet_autopilot.py \
            scripts/analysis/deep_branch_code_score.py \
            scripts/integrations/readiness_score.py

      - name: Run local XCore/Hermes benchmark and code checks
        run: |
          python3 scripts/agents/agent_fleet_control_catalog.py --agents 16 --mode local-first
          python3 scripts/agents/agent_fleet_autopilot.py --agents 16 --mode local-first
          python3 scripts/agents/hermes_fleet_readiness.py --strict
          python3 scripts/analysis/deep_branch_code_score.py
          python3 scripts/integrations/readiness_score.py

      - name: Verify benchmark outputs
        run: |
          test -f reports/branch-agents/agent-fleet-control-catalog.json
          test -f reports/branch-agents/agent-fleet-autopilot.json
          test -f reports/hermes-fleet/latest.json
          test -f reports/branch-intelligence/deep-branch-code-score.json
          test -f reports/integrations/readiness-score.json
          test -f reports/integrations/finish-readiness.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcore-hermes-local-benchmark
          path: |
            reports/branch-agents/agent-fleet-control-catalog.*
            reports/branch-agents/agent-fleet-autopilot.*
            reports/hermes-fleet/latest.*
            reports/branch-intelligence/deep-branch-code-score.*
            reports/integrations/readiness-score.*
            reports/integrations/finish-readiness.*
          if-no-files-found: error

  quality-summary:
    name: Local Benchmark and Code Check Summary
    if: always()
    needs: [powershell-lint, markdown-lint, json-validate, security-scan, xcore-hermes-local-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Report Status
        run: |
          echo "## Local code check and benchmark results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PowerShell Lint: ${{ needs.powershell-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Markdown Lint: ${{ needs.markdown-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- JSON Validation: ${{ needs.json-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- XCore/Hermes Local Benchmark: ${{ needs.xcore-hermes-local-benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Local benchmark and code-check system completed"
