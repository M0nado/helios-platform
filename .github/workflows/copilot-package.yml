name: helios-copilot-package

on:
  schedule:
    - cron: '21 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-package.yml
      - monado/helios-control/appPackage/**
      - monado/helios-control/config/microsoft-agents.json
      - monado/helios-control/config/microsoft-toolchain.json
      - monado/helios-control/config/cli-matrix.json
      - monado/helios-control/security/m365agentstoolkit-cli-audit/**
      - monado/helios-control/scripts/Invoke-M365AgentsToolkitAuditGate.ps1
      - appPackage/**
      - config/microsoft-agents.json
      - config/microsoft-toolchain.json
      - config/cli-matrix.json
      - security/m365agentstoolkit-cli-audit/**
      - scripts/Invoke-M365AgentsToolkitAuditGate.ps1
      - plugins/helios-control-fabric/**
      - .agents/plugins/marketplace.json
      - .github/agents/helios-control.agent.md
      - .github/instructions/helios-control.instructions.md
      - monado/helios-control/docs/UNIFIED_PLUGIN_SETUP.md
      - monado/helios-control/src/Helios.Connect.Api/Program.cs
      - monado/helios-control/src/Helios.Connect.Api/wwwroot/mcp/**
      - monado/helios-control/tests/Helios.Connect.Tests/WebhookTests.cs

permissions:
  actions: read
  contents: read

# Validation only: this workflow never signs in to or publishes into a tenant.

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Locate Helios project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "monado/helios-control/appPackage/manifest.json" ]]; then
            directory="monado/helios-control"
          elif [[ -f "appPackage/manifest.json" ]]; then
            directory="."
          else
            echo "Helios Copilot package manifest was not found." >&2
            exit 1
          fi
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

      - name: Set up pinned Node.js for Toolkit audit gate
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Enforce Microsoft 365 Agents Toolkit audit gate
        shell: pwsh
        run: ./scripts/Invoke-M365AgentsToolkitAuditGate.ps1
        working-directory: ${{ steps.project.outputs.directory }}

      - name: Validate unified plugin guardrails
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/helios-control-fabric/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/helios-control-fabric/.mcp.json >/dev/null
          for contract in connections oidc devops-sync runner-topology edge-runtime microsoft-mcp.template; do
            python -m json.tool "plugins/helios-control-fabric/assets/${contract}.json" >/dev/null
          done
          python -m unittest discover -s plugins/helios-control-fabric/scripts -p "test_*.py" -v

      - name: Resolve live effective GitHub OIDC subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          python plugins/helios-control-fabric/scripts/helios.py \
            oidc --environment azure-dev --json > /tmp/helios-oidc.json
          python - <<'PY'
          import json
          import os

          oidc = json.load(open("/tmp/helios-oidc.json"))
          assert isinstance(oidc["useImmutableSubject"], bool)
          assert oidc["repositoryId"] == os.environ["EXPECTED_REPOSITORY_ID"]
          assert oidc["ownerId"] == os.environ["EXPECTED_REPOSITORY_OWNER_ID"]
          owner, repository = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          if oidc["useImmutableSubject"]:
              repository_segment = (
                  f"{owner}@{oidc['ownerId']}/"
                  f"{repository}@{oidc['repositoryId']}"
              )
          else:
              repository_segment = f"{owner}/{repository}"
          expected = f"repo:{repository_segment}:environment:azure-dev"
          assert oidc["selectedSubject"] == expected
          assert oidc["secretsStoredInGitHub"] is False
          PY

      - name: Materialize Teams package icons
        shell: pwsh
        run: ./scripts/New-HeliosTeamsPackage.ps1
        working-directory: ${{ steps.project.outputs.directory }}

      - name: Validate Copilot package contract
        shell: bash
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          root = Path("appPackage")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          version = manifest.get("version", "")
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"invalid package version: {version!r}"
          expected_resource = "api://" + "$" + "{{PUBLIC_HOSTNAME}}/" + "$" + "{{ENTRA_APP_ID}}"
          assert manifest["webApplicationInfo"]["resource"] == expected_resource
          for name, expected in (("color.png", (192, 192)), ("outline.png", (32, 32))):
              data = (root / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", data[16:24]) == expected
          PY
