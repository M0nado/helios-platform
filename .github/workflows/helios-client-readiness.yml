name: HELIOS client readiness contracts

on:
  pull_request:
    paths:
      - '.github/workflows/helios-client-readiness.yml'
      - 'monado/helios-control/scripts/check_clients.py'
      - 'monado/helios-control/scripts/test_check_clients.py'
      - 'monado/helios-control/config/cli-matrix.json'
      - 'monado/helios-control/config/codex-mcp.example.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test bounded read-only probes with mocked providers
        working-directory: monado/helios-control/scripts
        run: python -m unittest -v test_check_clients
      - name: Validate non-secret client configurations
        run: python -c "import json,tomllib,pathlib; root=pathlib.Path('monado/helios-control/config'); json.loads((root/'cli-matrix.json').read_text()); cfg=tomllib.loads((root/'codex-mcp.example.toml').read_text()); assert cfg['mcp_servers']['helios']['enabled'] is False"
