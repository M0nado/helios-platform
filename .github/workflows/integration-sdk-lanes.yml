name: Integration SDK lanes

on:
  pull_request:
    paths:
      - global.json
      - Directory.Packages.props
      - '**/packages.lock.json'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/*.csproj'
      - eng/integration-lanes/**
      - config/integrations/event-contract.schema.json
      - docs/architecture/decisions/**
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate stable dependencies and contracts
        run: |
          python eng/integration-lanes/validate_lanes.py --contracts
          python -m unittest discover tests/integration -p 'test_*.py'
      - uses: actions/setup-dotnet@b2d7bde49078d7e2b34cc93653c2d4b2678d7a99 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify locked release restores
        run: |
          dotnet restore HELIOS.Platform.csproj --locked-mode
          dotnet restore src/core/HELIOS.Platform/HELIOS.Platform.csproj --locked-mode
      - name: Build and test normalized integration contracts
        run: dotnet test tests/contracts/HELIOS.Platform.Contracts.Tests/HELIOS.Platform.Contracts.Tests.csproj --configuration Release
      - name: Report deprecated NuGet dependencies
        run: dotnet list HELIOS.Platform.csproj package --deprecated --include-transitive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/openai/helios-mcp/package-lock.json
      - name: Verify locked npm dependency graph
        working-directory: plugins/openai/helios-mcp
        run: npm ci --ignore-scripts && npm audit --audit-level=moderate && npm run check
      - name: Require ADR evidence for stable promotion
        if: github.event_name == 'pull_request'
        run: python eng/integration-lanes/validate_promotion.py '${{ github.event.pull_request.base.sha }}'
      - name: Reject preview files in release input
        run: |
          test "$(git ls-files eng/integration-lanes/preview | wc -l)" -ge 2
          ! git ls-files | grep -E '(^|/)(bin|obj|dist|publish)/.*(preview|alpha|beta|rc)'

  preview-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Verify isolated preview Python lock and hashes
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.25
          uv lock --check --project eng/integration-lanes/preview
          uv export --project eng/integration-lanes/preview --format requirements.txt --no-dev --no-emit-project --no-header --output-file "$RUNNER_TEMP/requirements-preview.txt"
          diff -u eng/integration-lanes/preview/requirements-preview.txt "$RUNNER_TEMP/requirements-preview.txt"
      - name: Build isolated non-release preview image
        env:
          HELIOS_PREVIEW_IMAGE: helios-preview:${{ github.sha }}
        run: eng/integration-lanes/preview/build-container.sh

  preview-dotnet-11-windows:
    name: Non-publishing .NET 11 / WinUI / C++ probe
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@b2d7bde49078d7e2b34cc93653c2d4b2678d7a99 # v4.3.1
        with:
          dotnet-version: 11.0.100-preview.6.26359.118
      - name: Compile isolated C# and F# probes
        working-directory: eng/integration-lanes/preview/dotnet
        run: |
          dotnet build CSharpProbe/CSharpProbe.csproj --configuration Release -p:RestoreLockedMode=true
          dotnet build FSharpProbe/FSharpProbe.fsproj --configuration Release -p:RestoreLockedMode=true
      - name: Compile isolated WinUI 3 probe
        working-directory: eng/integration-lanes/preview/dotnet
        run: dotnet build WinUIProbe/WinUIProbe.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Compile and run isolated C++23 renderer probe
        run: |
          cmake -S eng/integration-lanes/preview/native -B $env:RUNNER_TEMP/helios-preview-native -A x64
          cmake --build $env:RUNNER_TEMP/helios-preview-native --config Release --parallel 2
          & "$env:RUNNER_TEMP/helios-preview-native/Release/helios_preview_renderer.exe"
      - name: Assert preview output remains outside release staging
        shell: pwsh
        run: |
          if (Test-Path dist) { throw 'Preview job must not create release staging.' }
