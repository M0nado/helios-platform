name: Component Version Check

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail when invalid or missing versions are found'
        required: false
        default: 'true'
      verbose:
        description: 'Include a full component table in the run summary'
        required: false
        default: 'false'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.csproj'
      - '**/package.json'
      - '**/version.json'
      - '.github/workflows/component-version-check.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '**/package.json'
      - '**/version.json'
      - '.github/workflows/component-version-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-versions:
    name: Validate Component Versions
    runs-on: ubuntu-latest
    outputs:
      component_count: ${{ steps.validate.outputs.component_count }}
      invalid_count: ${{ steps.validate.outputs.invalid_count }}
      status: ${{ steps.validate.outputs.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version manifests
        id: validate
        env:
          STRICT_MODE: ${{ github.event.inputs.strict || 'true' }}
          VERBOSE_MODE: ${{ github.event.inputs.verbose || 'false' }}
        run: |
          python << 'PYTHON_EOF'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ROOT = Path(".")
          IGNORE_SEGMENTS = {".git", "node_modules", "bin", "obj"}
          VERSION_PATTERN = re.compile(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")

          strict_mode = os.environ.get("STRICT_MODE", "true").lower() == "true"
          verbose_mode = os.environ.get("VERBOSE_MODE", "false").lower() == "true"

          def should_ignore(path: Path) -> bool:
              return any(segment in IGNORE_SEGMENTS for segment in path.parts)

          def discover_files() -> list[Path]:
              files: list[Path] = []
              for pattern in ("**/*.csproj", "**/package.json", "**/version.json"):
                  for candidate in ROOT.glob(pattern):
                      if candidate.is_file() and not should_ignore(candidate):
                          files.append(candidate)
              files = sorted(set(files))
              return files

          def local_name(tag: str) -> str:
              return tag.rsplit("}", 1)[-1]

          def read_csproj_version(path: Path) -> tuple[str | None, str]:
              tree = ET.parse(path)
              root = tree.getroot()
              for key in ("Version", "PackageVersion", "AssemblyVersion"):
                  for node in root.iter():
                      if local_name(node.tag) == key and node.text and node.text.strip():
                          return node.text.strip(), path.stem
              return None, path.stem

          def read_json_version(path: Path) -> tuple[str | None, str]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              component_name = payload.get("name")
              if not isinstance(component_name, str) or not component_name.strip():
                  component_name = path.parent.name
              version_value = payload.get("version")
              if isinstance(version_value, str):
                  version_value = version_value.strip()
              else:
                  version_value = None
              return version_value, component_name

          components: list[dict[str, str]] = []
          errors: list[str] = []
          warnings: list[str] = []
          for manifest in discover_files():
              rel_path = manifest.relative_to(ROOT).as_posix()
              if manifest.suffix == ".csproj":
                  version, name = read_csproj_version(manifest)
                  if not version:
                      warnings.append(f"{rel_path}: no explicit version metadata found (skipped)")
                      continue
              else:
                  version, name = read_json_version(manifest)
                  if not version:
                      errors.append(f"{rel_path}: missing version value")
                      continue

              if VERSION_PATTERN.match(version) is None:
                  errors.append(f"{rel_path}: invalid semantic version '{version}'")
                  continue

              components.append(
                  {
                      "component": name,
                      "path": rel_path,
                      "version": version,
                  }
              )

          report = {
              "ok": len(errors) == 0,
              "strictMode": strict_mode,
              "componentCount": len(components),
              "invalidCount": len(errors),
              "warningCount": len(warnings),
              "errors": errors,
              "warnings": warnings,
              "components": components,
          }

          Path("artifacts").mkdir(parents=True, exist_ok=True)
          Path("artifacts/component-version-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"component_count={len(components)}\n")
              output.write(f"invalid_count={len(errors)}\n")
              output.write(f"status={'success' if len(errors) == 0 else 'failure'}\n")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Component Version Validation\n\n")
              summary.write(f"- Strict mode: `{strict_mode}`\n")
              summary.write(f"- Valid components: `{len(components)}`\n")
              summary.write(f"- Invalid components: `{len(errors)}`\n")
              summary.write(f"- Warnings: `{len(warnings)}`\n")
              if errors:
                  summary.write("\n### Errors\n")
                  for error in errors:
                      summary.write(f"- {error}\n")
              if warnings and verbose_mode:
                  summary.write("\n### Warnings\n")
                  for warning in warnings:
                      summary.write(f"- {warning}\n")
              if verbose_mode and components:
                  summary.write("\n### Validated Components\n")
                  summary.write("| Component | Version | Manifest |\n")
                  summary.write("| --- | --- | --- |\n")
                  for item in components:
                      summary.write(
                          f"| {item['component']} | {item['version']} | `{item['path']}` |\n"
                      )

          if errors and strict_mode:
              raise SystemExit(1)
          PYTHON_EOF

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: component-version-report
          path: artifacts/component-version-report.json
          retention-days: 14

  comment-on-pr:
    name: Comment Version Status
    if: github.event_name == 'pull_request' && always()
    needs: validate-versions
    runs-on: ubuntu-latest
    steps:
      - name: Comment validation outcome
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.validate-versions.result }}' === 'success' ? '✅' : '❌';
            const body = [
              `## ${status} Component Version Validation`,
              '',
              `- Result: **${{ needs.validate-versions.result }}**`,
              `- Valid components: **${{ needs.validate-versions.outputs.component_count }}**`,
              `- Invalid components: **${{ needs.validate-versions.outputs.invalid_count }}**`,
              '',
              `[Open run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
