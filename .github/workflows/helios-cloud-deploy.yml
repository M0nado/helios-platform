name: helios-cloud-deploy

on:
  pull_request:
    paths:
      - .github/workflows/helios-cloud-deploy.yml
      - monado/helios-control/**
      - infra/connector.bicep
      - src/**
      - tests/**
  workflow_dispatch:
    inputs:
      targetEnvironment:
        description: Protected GitHub environment containing the Azure OIDC variables
        required: true
        type: choice
        default: azure-dev
        options:
          - azure-dev
          - azure-test
          - azure-prod
      mode:
        description: Preview is the default; deploy requires a second protected-environment approval
        required: true
        type: choice
        default: what-if
        options:
          - what-if
          - deploy
      reviewedRunId:
        description: Workflow run ID from a completed what-if run for the same commit/environment (required for deploy mode)
        required: false
        type: string
        default: ""
      confirmDeployment:
        description: Enter DEPLOY when mode is deploy; ignored for what-if
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: helios-cloud-${{ inputs.targetEnvironment || 'validation' }}
  cancel-in-progress: false

env:
  HELIOS_BICEP_VERSION: v0.43.8
  HELIOS_DOTNET_SDK_VERSION: 8.0.423

jobs:
  validate:
    name: Validate deployment request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      project-directory: ${{ steps.project.outputs.directory }}
      common_tags_json: ${{ steps.parameters.outputs.common_tags_json }}
      common_tags_sha256: ${{ steps.parameters.outputs.common_tags_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Locate Helios project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "infra/connector.bicep" ]]; then
            directory="."
          elif [[ -f "monado/helios-control/infra/connector.bicep" ]]; then
            directory="monado/helios-control"
          else
            echo "Helios connector.bicep was not found." >&2
            exit 1
          fi
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

      - name: Validate canonical deployment parameters
        id: parameters
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ steps.project.outputs.directory }}
        run: |
          set -euo pipefail
          common_tags_json="$(jq -cS '.parameters.commonTags.value' "${PROJECT_DIRECTORY}/infra/main.parameters.json")"
          if ! jq --exit-status '
            type == "object" and
            has("cost-center") and has("data-classification") and has("lifecycle") and
            all(.[]; type == "string" and length > 0)
          ' <<<"${common_tags_json}" > /dev/null; then
            echo "The canonical commonTags parameter must include non-empty cost-center, data-classification, and lifecycle string values." >&2
            exit 1
          fi
          common_tags_sha256="$(printf '%s' "${common_tags_json}" | sha256sum | cut -d' ' -f1)"
          echo "common_tags_json=${common_tags_json}" >> "${GITHUB_OUTPUT}"
          echo "common_tags_sha256=${common_tags_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Enforce explicit deploy confirmation
        shell: bash
        env:
          DEPLOYMENT_MODE: ${{ inputs.mode || 'what-if' }}
          REVIEWED_RUN_ID: ${{ inputs.reviewedRunId || '' }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmDeployment || '' }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYMENT_MODE}" == "deploy" ]]; then
            if [[ "${DEPLOYMENT_CONFIRMATION}" != "DEPLOY" ]]; then
              echo "A deploy run requires confirmDeployment=DEPLOY." >&2
              exit 1
            fi
            if [[ ! "${REVIEWED_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "A deploy run requires reviewedRunId to be the numeric workflow run ID from a completed what-if run." >&2
              exit 1
            fi
          fi

      - name: Build pinned Bicep template
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ steps.project.outputs.directory }}
        run: |
          set -euo pipefail
          az bicep install --version "${HELIOS_BICEP_VERSION}"
          az bicep version
          az bicep build --file "${PROJECT_DIRECTORY}/infra/connector.bicep"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.HELIOS_DOTNET_SDK_VERSION }}

      - name: Run tests
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ steps.project.outputs.directory }}
        run: dotnet test "${PROJECT_DIRECTORY}/Helios.Connect.sln" --configuration Release

  preview:
    name: Reviewed Azure what-if (${{ inputs.targetEnvironment }})
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'what-if') == 'what-if' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The operator bootstrap verifies this environment's reviewer protection via
    # the GitHub API before creating OIDC federation; a variable is not evidence.
    environment: ${{ inputs.targetEnvironment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      image_reference: ${{ steps.image.outputs.image_reference }}
      resource_group_location: ${{ steps.registry.outputs.resource_group_location }}
      registry_name: ${{ steps.registry.outputs.registry_name }}
      template_sha256: ${{ steps.template.outputs.template_sha256 }}
      what_if_sha256: ${{ steps.whatif.outputs.what_if_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate protected environment variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          HELIOS_CONTAINER_REGISTRY_NAME: ${{ vars.HELIOS_CONTAINER_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            HELIOS_ENTRA_CLIENT_ID
            HELIOS_ALLOWED_CLIENT_IDS
            HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID
            HELIOS_CONTAINER_REGISTRY_NAME
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required protected environment variable ${name} is not configured." >&2
              exit 1
            fi
          done
          if [[ ! "${HELIOS_CONTAINER_REGISTRY_NAME}" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "HELIOS_CONTAINER_REGISTRY_NAME must be a lowercase Azure Container Registry resource name." >&2
            exit 1
          fi

      - name: Azure login with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version "${HELIOS_BICEP_VERSION}"
          az bicep version

      - name: Compile canonical reviewed deployment template
        id: template
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ needs.validate.outputs.project-directory }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${GITHUB_SHA}" ]]; then
            echo "The template checkout does not match GITHUB_SHA." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The template source tree is not clean." >&2
            exit 1
          fi
          raw_template="${RUNNER_TEMP}/helios-connector.template.raw.json"
          canonical_template="${RUNNER_TEMP}/helios-connector.template.json"
          az bicep build \
            --file "${PROJECT_DIRECTORY}/infra/connector.bicep" \
            --outfile "${raw_template}"
          jq --sort-keys . "${raw_template}" > "${canonical_template}"
          template_sha256="$(sha256sum "${canonical_template}" | cut -d' ' -f1)"
          if [[ ! "${template_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The compiled deployment template did not produce a valid SHA-256 digest." >&2
            exit 1
          fi
          echo "template_path=${canonical_template}" >> "${GITHUB_OUTPUT}"
          echo "template_sha256=${template_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Verify configured registry binding
        id: registry
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          HELIOS_CONTAINER_REGISTRY_NAME: ${{ vars.HELIOS_CONTAINER_REGISTRY_NAME }}
        run: |
          set -euo pipefail

          actual_subscription_id="$(az account show --query id --output tsv)"
          if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
            echo "Azure CLI is not using the configured protected-environment subscription." >&2
            exit 1
          fi

          configured_server="${HELIOS_CONTAINER_REGISTRY_NAME}.azurecr.io"
          registry_json="$(az acr show \
            --name "${HELIOS_CONTAINER_REGISTRY_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --output json)"
          resource_group_json="$(az group show \
            --name "${AZURE_RESOURCE_GROUP}" \
            --subscription "${AZURE_SUBSCRIPTION_ID}" \
            --output json)"
          registry_id="$(jq -r '.id' <<<"${registry_json}")"
          registry_server="$(jq -r '.loginServer' <<<"${registry_json}")"
          registry_role_assignment_mode="$(jq -r '.roleAssignmentMode // "rbac"' <<<"${registry_json}")"
          resource_group_id="$(jq -r '.id' <<<"${resource_group_json}")"
          resource_group_location="$(jq -r '.location' <<<"${resource_group_json}")"
          expected_registry_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.ContainerRegistry/registries/${HELIOS_CONTAINER_REGISTRY_NAME}"
          expected_resource_group_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}"

          if [[ "${registry_id,,}" != "${expected_registry_id,,}" ]]; then
            echo "The configured registry did not resolve in the configured subscription and resource group." >&2
            exit 1
          fi
          if [[ "${resource_group_id,,}" != "${expected_resource_group_id,,}" || ! "${resource_group_location}" =~ ^[a-z0-9-]+$ ]]; then
            echo "The configured resource group returned an unexpected ID or location." >&2
            exit 1
          fi
          if [[ "${registry_server}" != "${configured_server}" ]]; then
            echo "Azure returned an unexpected login server for the configured registry." >&2
            exit 1
          fi
          if [[ "${registry_role_assignment_mode}" != "rbac" && "${registry_role_assignment_mode}" != "rbac-abac" ]]; then
            echo "Azure returned an unsupported registry role-assignment mode." >&2
            exit 1
          fi
          echo "registry_name=${HELIOS_CONTAINER_REGISTRY_NAME}" >> "${GITHUB_OUTPUT}"
          echo "registry_server=${registry_server}" >> "${GITHUB_OUTPUT}"
          echo "registry_role_assignment_mode=${registry_role_assignment_mode}" >> "${GITHUB_OUTPUT}"
          echo "resource_group_location=${resource_group_location}" >> "${GITHUB_OUTPUT}"

      - name: Build exact checked-out commit and resolve immutable digest
        id: image
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ needs.validate.outputs.project-directory }}
          REGISTRY_NAME: ${{ steps.registry.outputs.registry_name }}
          REGISTRY_SERVER: ${{ steps.registry.outputs.registry_server }}
          REGISTRY_ROLE_ASSIGNMENT_MODE: ${{ steps.registry.outputs.registry_role_assignment_mode }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${GITHUB_SHA}" ]]; then
            echo "The checked-out commit does not match GITHUB_SHA." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The checked-out source tree is not clean; refusing to build ambiguous content." >&2
            git status --short >&2
            exit 1
          fi

          dockerfile='src/Helios.Connect.Api/Dockerfile'
          if [[ ! -f "${PROJECT_DIRECTORY}/${dockerfile}" ]]; then
            echo "The reviewed connector Dockerfile was not found." >&2
            exit 1
          fi
          repository='helios-connect'
          tag="git-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_auth_args=()
          if [[ "${REGISTRY_ROLE_ASSIGNMENT_MODE}" == 'rbac-abac' ]]; then
            source_auth_args=(--source-acr-auth-id '[caller]')
          fi
          pushd "${PROJECT_DIRECTORY}" > /dev/null
          az acr build \
            --registry "${REGISTRY_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${repository}:${tag}" \
            --file "${dockerfile}" \
            --no-logs \
            --output none \
            "${source_auth_args[@]}" \
            .
          popd > /dev/null

          az account get-access-token \
            --scope 'https://containerregistry.azure.net/.default' \
            --output none
          digest="$(az acr repository show \
            --name "${REGISTRY_NAME}" \
            --image "${repository}:${tag}" \
            --query digest \
            --output tsv)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ACR did not return an immutable digest for GITHUB_SHA ${GITHUB_SHA}." >&2
            exit 1
          fi
          immutable_reference="${REGISTRY_SERVER}/${repository}@${digest}"
          if [[ ! "${immutable_reference}" =~ ^[a-z0-9]{5,50}\.azurecr\.io/helios-connect@sha256:[0-9a-f]{64}$ ]]; then
            echo "The workflow produced an invalid immutable ACR reference." >&2
            exit 1
          fi
          echo "image_reference=${immutable_reference}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Built ${immutable_reference} from exact commit ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Capture canonical Azure Resource Manager what-if
        id: whatif
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ needs.validate.outputs.project-directory }}
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          CONTAINER_REGISTRY_NAME: ${{ steps.registry.outputs.registry_name }}
          RESOURCE_GROUP_LOCATION: ${{ steps.registry.outputs.resource_group_location }}
          SERVICE_NAME: helios-connector
          TEMPLATE_PATH: ${{ steps.template.outputs.template_path }}
          TEMPLATE_SHA256: ${{ steps.template.outputs.template_sha256 }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          COMMON_TAGS_JSON: ${{ needs.validate.outputs.common_tags_json }}
          COMMON_TAGS_SHA256: ${{ needs.validate.outputs.common_tags_sha256 }}
        run: |
          set -euo pipefail
          environment_name="${TARGET_ENVIRONMENT#azure-}"
          artifact_dir="${RUNNER_TEMP}/helios-what-if"
          raw_what_if="${RUNNER_TEMP}/helios-what-if.raw.json"
          mkdir -p "${artifact_dir}"

          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${TEMPLATE_PATH}" \
            --result-format FullResourcePayloads \
            --parameters \
              location="${RESOURCE_GROUP_LOCATION}" \
              environmentName="${environment_name}" \
              serviceName="${SERVICE_NAME}" \
              containerImage="${IMAGE_REFERENCE}" \
              containerRegistryName="${CONTAINER_REGISTRY_NAME}" \
              allowPreviewPlaceholder=false \
              entraClientId="${HELIOS_ENTRA_CLIENT_ID}" \
              entraTenantId="${AZURE_TENANT_ID}" \
              allowedClientIds="${HELIOS_ALLOWED_CLIENT_IDS}" \
              allowedPrincipalObjectId="${HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID}" \
              sourceCommitSha="${GITHUB_SHA}" \
              commonTags="${COMMON_TAGS_JSON}" \
            --output json > "${raw_what_if}"

          full_what_if="${RUNNER_TEMP}/helios-what-if.full.canonical.json"
          jq --sort-keys . "${raw_what_if}" > "${full_what_if}"
          what_if_sha256="$(sha256sum "${full_what_if}" | cut -d' ' -f1)"
          cp "${full_what_if}" "${artifact_dir}/what-if.full.json"
          jq --sort-keys '
            walk(
              if type == "object" then
                (.name? // "") as $name |
                if (($name | type) == "string" and ($name | test("(SECRET|PASSWORD|TOKEN|CONNECTION_STRING|API_KEY|KEY$)"; "i")) and has("value")) then
                  .value = "<redacted>"
                else
                  with_entries(
                    if (.key | test("(secret|password|token|connectionstring|instrumentationkey|sharedkey|apikey)$"; "i")) then
                      .value = "<redacted>"
                    else
                      .
                    end
                  )
                end
              else
                .
              end
            )
          ' "${raw_what_if}" > "${artifact_dir}/what-if.json"
          review_sha256="$(sha256sum "${artifact_dir}/what-if.json" | cut -d' ' -f1)"
          jq --null-input \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg sourceSha "${GITHUB_SHA}" \
            --argjson commonTags "${COMMON_TAGS_JSON}" \
            --arg commonTagsSha256 "${COMMON_TAGS_SHA256}" \
            --arg targetEnvironment "${TARGET_ENVIRONMENT}" \
            --arg templateSha256 "${TEMPLATE_SHA256}" \
            --arg location "${RESOURCE_GROUP_LOCATION}" \
            --arg environmentName "${environment_name}" \
            --arg serviceName "${SERVICE_NAME}" \
            --arg imageReference "${IMAGE_REFERENCE}" \
            --arg registryName "${CONTAINER_REGISTRY_NAME}" \
            --arg entraClientId "${HELIOS_ENTRA_CLIENT_ID}" \
            --arg entraTenantId "${AZURE_TENANT_ID}" \
            --arg allowedClientIds "${HELIOS_ALLOWED_CLIENT_IDS}" \
            --arg allowedPrincipalObjectId "${HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID}" \
            --arg subscriptionId "${AZURE_SUBSCRIPTION_ID}" \
            --arg resourceGroup "${AZURE_RESOURCE_GROUP}" \
            --arg whatIfSha256 "${what_if_sha256}" \
            --arg reviewSha256 "${review_sha256}" \
            '{schemaVersion: 2, runId: $runId, sourceSha: $sourceSha, targetEnvironment: $targetEnvironment, subscriptionId: $subscriptionId, resourceGroup: $resourceGroup, template: {sha256: $templateSha256}, commonTagsSha256: $commonTagsSha256, parameters: {location: $location, environmentName: $environmentName, serviceName: $serviceName, containerImage: $imageReference, containerRegistryName: $registryName, commonTags: $commonTags, allowPreviewPlaceholder: false, entraClientId: $entraClientId, entraTenantId: $entraTenantId, allowedClientIds: $allowedClientIds, allowedPrincipalObjectId: $allowedPrincipalObjectId, sourceCommitSha: $sourceSha}, whatIfSha256: $whatIfSha256, reviewSha256: $reviewSha256}' \
            > "${artifact_dir}/request.json"

          echo "what_if_sha256=${what_if_sha256}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Azure what-if ready for deployment review"
            echo ""
            echo "- Environment: \`${TARGET_ENVIRONMENT}\`"
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Reviewed what-if run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Compiled template SHA-256: \`${TEMPLATE_SHA256}\`"
            echo "- Full canonical what-if SHA-256: \`${what_if_sha256}\`"
            echo "- Review-safe artifact content SHA-256: \`${review_sha256}\`"
            echo "- Deploy inputs after approval: \`mode=deploy\`, \`reviewedRunId=${GITHUB_RUN_ID}\`, \`confirmDeployment=DEPLOY\`"
            echo "- A deploy request now requires a second protected-environment approval."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish immutable what-if evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helios-what-if-${{ github.run_id }}-${{ inputs.targetEnvironment }}
          path: ${{ runner.temp }}/helios-what-if
          if-no-files-found: error
          retention-days: 14

      - name: Record immutable artifact digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ && ! "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The artifact action did not return a valid SHA-256 digest." >&2
            exit 1
          fi
          echo "- GitHub artifact SHA-256: \`${ARTIFACT_DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy after second approval (${{ inputs.targetEnvironment }})
    if: ${{ inputs.mode == 'deploy' && inputs.confirmDeployment == 'DEPLOY' }}
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A second environment deployment creates a distinct approval gate after
    # the immutable what-if artifact is available to reviewers.
    environment: ${{ inputs.targetEnvironment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate protected environment variables again
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          HELIOS_CONTAINER_REGISTRY_NAME: ${{ vars.HELIOS_CONTAINER_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            HELIOS_ENTRA_CLIENT_ID
            HELIOS_ALLOWED_CLIENT_IDS
            HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID
            HELIOS_CONTAINER_REGISTRY_NAME
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required protected environment variable ${name} is not configured." >&2
              exit 1
            fi
          done
          if [[ ! "${HELIOS_CONTAINER_REGISTRY_NAME}" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "HELIOS_CONTAINER_REGISTRY_NAME must be a lowercase Azure Container Registry resource name." >&2
            exit 1
          fi

      - name: Azure login with GitHub OIDC after second approval
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned Bicep CLI again
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version "${HELIOS_BICEP_VERSION}"
          az bicep version

      - name: Recompile the reviewed deployment template
        id: template
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ needs.validate.outputs.project-directory }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${GITHUB_SHA}" ]]; then
            echo "The deployment checkout does not match GITHUB_SHA." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The deployment source tree is not clean." >&2
            exit 1
          fi
          raw_template="${RUNNER_TEMP}/helios-connector.deploy.template.raw.json"
          canonical_template="${RUNNER_TEMP}/helios-connector.deploy.template.json"
          az bicep build \
            --file "${PROJECT_DIRECTORY}/infra/connector.bicep" \
            --outfile "${raw_template}"
          jq --sort-keys . "${raw_template}" > "${canonical_template}"
          template_sha256="$(sha256sum "${canonical_template}" | cut -d' ' -f1)"
          if [[ ! "${template_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The recompiled deployment template did not produce a valid SHA-256 digest." >&2
            exit 1
          fi
          echo "template_path=${canonical_template}" >> "${GITHUB_OUTPUT}"
          echo "template_sha256=${template_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Validate reviewed what-if run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN_ID: ${{ inputs.reviewedRunId }}
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEWED_RUN_ID}")"
          run_status="$(jq -r '.status' <<<"${run_json}")"
          run_conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          run_event="$(jq -r '.event' <<<"${run_json}")"
          run_workflow_path="$(jq -r '.path // ""' <<<"${run_json}")"
          run_head_sha="$(jq -r '.head_sha' <<<"${run_json}")"

          if [[ "${run_status}" != "completed" || "${run_conclusion}" != "success" ]]; then
            echo "The reviewed run must be a completed successful what-if run." >&2
            exit 1
          fi
          if [[ "${run_event}" != "workflow_dispatch" || "${run_workflow_path}" != ".github/workflows/helios-cloud-deploy.yml" ]]; then
            echo "reviewedRunId must reference a workflow_dispatch run of .github/workflows/helios-cloud-deploy.yml." >&2
            exit 1
          fi
          if [[ "${run_head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "The reviewed run commit does not match this deploy run commit." >&2
            exit 1
          fi
          echo "- Reviewed what-if run: \`${REVIEWED_RUN_ID}\` (\`${run_head_sha}\`, \`${TARGET_ENVIRONMENT}\`)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Download reviewed what-if evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helios-what-if-${{ inputs.reviewedRunId }}-${{ inputs.targetEnvironment }}
          path: ${{ runner.temp }}/approved-what-if
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reviewedRunId }}

      - name: Verify reviewed what-if evidence
        id: evidence
        shell: bash
        env:
          REVIEWED_RUN_ID: ${{ inputs.reviewedRunId }}
          ACTUAL_TEMPLATE_SHA256: ${{ steps.template.outputs.template_sha256 }}
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          HELIOS_CONTAINER_REGISTRY_NAME: ${{ vars.HELIOS_CONTAINER_REGISTRY_NAME }}
          COMMON_TAGS_JSON: ${{ needs.validate.outputs.common_tags_json }}
          COMMON_TAGS_SHA256: ${{ needs.validate.outputs.common_tags_sha256 }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/approved-what-if"
          request_path="${evidence_dir}/request.json"
          review_path="${evidence_dir}/what-if.json"
          full_what_if_path="${evidence_dir}/what-if.full.json"
          environment_name="${TARGET_ENVIRONMENT#azure-}"

          for required_file in "${request_path}" "${review_path}" "${full_what_if_path}"; do
            if [[ ! -f "${required_file}" ]]; then
              echo "Reviewed what-if artifact is missing ${required_file##*/}." >&2
              exit 1
            fi
          done

          actual_review_sha256="$(sha256sum "${review_path}" | cut -d' ' -f1)"
          actual_full_what_if_sha256="$(sha256sum "${full_what_if_path}" | cut -d' ' -f1)"
          expected_review_sha256="$(jq --raw-output '.reviewSha256' "${request_path}")"
          expected_full_what_if_sha256="$(jq --raw-output '.whatIfSha256' "${request_path}")"
          if [[ "${actual_review_sha256}" != "${expected_review_sha256}" ]]; then
            echo "Downloaded review-safe what-if evidence does not match its recorded digest." >&2
            exit 1
          fi
          if [[ "${actual_full_what_if_sha256}" != "${expected_full_what_if_sha256}" ]]; then
            echo "Downloaded full canonical what-if evidence does not match its recorded digest." >&2
            exit 1
          fi

          image_reference="$(jq --raw-output '.parameters.containerImage' "${request_path}")"
          registry_name="$(jq --raw-output '.parameters.containerRegistryName' "${request_path}")"
          resource_group_location="$(jq --raw-output '.parameters.location' "${request_path}")"
          service_name="$(jq --raw-output '.parameters.serviceName' "${request_path}")"
          if [[ ! "${image_reference}" =~ ^[a-z0-9]{5,50}\.azurecr\.io/helios-connect@sha256:[0-9a-f]{64}$ ]]; then
            echo "Reviewed evidence does not contain a valid immutable Helios image reference." >&2
            exit 1
          fi

          if [[ "${registry_name}" != "${HELIOS_CONTAINER_REGISTRY_NAME}" ]]; then
            echo "The protected registry binding changed after the reviewed what-if run; start a new workflow run." >&2
            exit 1
          fi

          jq --exit-status \
            --arg runId "${REVIEWED_RUN_ID}" \
            --arg sourceSha "${GITHUB_SHA}" \
            --argjson commonTags "${COMMON_TAGS_JSON}" \
            --arg commonTagsSha256 "${COMMON_TAGS_SHA256}" \
            --arg targetEnvironment "${TARGET_ENVIRONMENT}" \
            --arg templateSha256 "${ACTUAL_TEMPLATE_SHA256}" \
            --arg location "${resource_group_location}" \
            --arg environmentName "${environment_name}" \
            --arg serviceName "${service_name}" \
            --arg imageReference "${image_reference}" \
            --arg registryName "${registry_name}" \
            --arg entraClientId "${HELIOS_ENTRA_CLIENT_ID}" \
            --arg entraTenantId "${AZURE_TENANT_ID}" \
            --arg allowedClientIds "${HELIOS_ALLOWED_CLIENT_IDS}" \
            --arg allowedPrincipalObjectId "${HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID}" \
            --arg subscriptionId "${AZURE_SUBSCRIPTION_ID}" \
            --arg resourceGroup "${AZURE_RESOURCE_GROUP}" \
            --arg whatIfSha256 "${actual_full_what_if_sha256}" \
            --arg reviewSha256 "${actual_review_sha256}" \
            '.schemaVersion == 2 and .runId == $runId and .sourceSha == $sourceSha and .targetEnvironment == $targetEnvironment and .subscriptionId == $subscriptionId and .resourceGroup == $resourceGroup and .template == {sha256: $templateSha256} and .commonTagsSha256 == $commonTagsSha256 and .parameters == {location: $location, environmentName: $environmentName, serviceName: $serviceName, containerImage: $imageReference, containerRegistryName: $registryName, commonTags: $commonTags, allowPreviewPlaceholder: false, entraClientId: $entraClientId, entraTenantId: $entraTenantId, allowedClientIds: $allowedClientIds, allowedPrincipalObjectId: $allowedPrincipalObjectId, sourceCommitSha: $sourceSha} and .whatIfSha256 == $whatIfSha256 and .reviewSha256 == $reviewSha256' \
            "${request_path}" > /dev/null

          echo "image_reference=${image_reference}" >> "${GITHUB_OUTPUT}"
          echo "registry_name=${registry_name}" >> "${GITHUB_OUTPUT}"
          echo "resource_group_location=${resource_group_location}" >> "${GITHUB_OUTPUT}"
          echo "environment_name=${environment_name}" >> "${GITHUB_OUTPUT}"
          echo "service_name=${service_name}" >> "${GITHUB_OUTPUT}"
          echo "what_if_sha256=${actual_full_what_if_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Re-verify configured registry and published digest
        id: registry
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.evidence.outputs.image_reference }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          HELIOS_CONTAINER_REGISTRY_NAME: ${{ vars.HELIOS_CONTAINER_REGISTRY_NAME }}
          EXPECTED_RESOURCE_GROUP_LOCATION: ${{ steps.evidence.outputs.resource_group_location }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_REFERENCE}" =~ ^[a-z0-9]{5,50}\.azurecr\.io/helios-connect@sha256:[0-9a-f]{64}$ ]]; then
            echo "The reviewed workflow output is not a valid immutable Helios image." >&2
            exit 1
          fi
          configured_server="${HELIOS_CONTAINER_REGISTRY_NAME}.azurecr.io"
          if [[ "${IMAGE_REFERENCE%%/*}" != "${configured_server}" ]]; then
            echo "The deployment image registry no longer matches the protected environment binding." >&2
            exit 1
          fi
          actual_subscription_id="$(az account show --query id --output tsv)"
          if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
            echo "Azure CLI is not using the configured protected-environment subscription." >&2
            exit 1
          fi

          registry_json="$(az acr show \
            --name "${HELIOS_CONTAINER_REGISTRY_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --output json)"
          registry_id="$(jq -r '.id' <<<"${registry_json}")"
          registry_server="$(jq -r '.loginServer' <<<"${registry_json}")"
          resource_group_location="$(az group show \
            --name "${AZURE_RESOURCE_GROUP}" \
            --subscription "${AZURE_SUBSCRIPTION_ID}" \
            --query location \
            --output tsv)"
          expected_registry_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.ContainerRegistry/registries/${HELIOS_CONTAINER_REGISTRY_NAME}"
          if [[ "${registry_id,,}" != "${expected_registry_id,,}" || "${registry_server}" != "${configured_server}" ]]; then
            echo "The configured registry changed after preview; start a new workflow run." >&2
            exit 1
          fi
          if [[ "${resource_group_location}" != "${EXPECTED_RESOURCE_GROUP_LOCATION}" ]]; then
            echo "The configured resource-group location changed after preview; start a new workflow run." >&2
            exit 1
          fi

          image_path="${IMAGE_REFERENCE#*/}"
          repository="${image_path%@sha256:*}"
          digest="${IMAGE_REFERENCE##*@}"
          az account get-access-token \
            --scope 'https://containerregistry.azure.net/.default' \
            --output none
          if ! manifest_json="$(az acr repository show \
            --name "${HELIOS_CONTAINER_REGISTRY_NAME}" \
            --image "${repository}@${digest}" \
            --output json)"; then
            echo "The immutable digest could not be read. The operator must grant the GitHub OIDC identity AcrPull (RBAC-only registry) or Container Registry Repository Reader (ABAC registry)." >&2
            exit 1
          fi
          manifest_digest="$(jq -r '.digest // ""' <<<"${manifest_json}")"
          if [[ "${manifest_digest,,}" != "${digest,,}" ]]; then
            echo "The reviewed immutable digest is no longer available in the configured registry." >&2
            exit 1
          fi
          if ! jq --exit-status '.changeableAttributes.writeEnabled == false and .changeableAttributes.deleteEnabled == false' <<<"${manifest_json}" > /dev/null; then
            echo "The reviewed immutable digest is still mutable (writeEnabled/deleteEnabled must both be false)." >&2
            exit 1
          fi
          echo "registry_name=${HELIOS_CONTAINER_REGISTRY_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Re-run what-if and fail on drift
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          IMAGE_REFERENCE: ${{ steps.evidence.outputs.image_reference }}
          CONTAINER_REGISTRY_NAME: ${{ steps.evidence.outputs.registry_name }}
          RESOURCE_GROUP_LOCATION: ${{ steps.evidence.outputs.resource_group_location }}
          SERVICE_NAME: ${{ steps.evidence.outputs.service_name }}
          TEMPLATE_PATH: ${{ steps.template.outputs.template_path }}
          EXPECTED_WHAT_IF_SHA256: ${{ steps.evidence.outputs.what_if_sha256 }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          COMMON_TAGS_JSON: ${{ needs.validate.outputs.common_tags_json }}
        run: |
          set -euo pipefail
          environment_name="${TARGET_ENVIRONMENT#azure-}"
          raw_what_if="${RUNNER_TEMP}/helios-drift-check.raw.json"
          canonical_what_if="${RUNNER_TEMP}/helios-drift-check.json"
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${TEMPLATE_PATH}" \
            --result-format FullResourcePayloads \
            --parameters \
              location="${RESOURCE_GROUP_LOCATION}" \
              environmentName="${environment_name}" \
              serviceName="${SERVICE_NAME}" \
              containerImage="${IMAGE_REFERENCE}" \
              containerRegistryName="${CONTAINER_REGISTRY_NAME}" \
              allowPreviewPlaceholder=false \
              entraClientId="${HELIOS_ENTRA_CLIENT_ID}" \
              entraTenantId="${AZURE_TENANT_ID}" \
              allowedClientIds="${HELIOS_ALLOWED_CLIENT_IDS}" \
              allowedPrincipalObjectId="${HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID}" \
              sourceCommitSha="${GITHUB_SHA}" \
              commonTags="${COMMON_TAGS_JSON}" \
            --output json > "${raw_what_if}"
          jq --sort-keys . "${raw_what_if}" > "${canonical_what_if}"
          actual_what_if_sha256="$(sha256sum "${canonical_what_if}" | cut -d' ' -f1)"
          if [[ "${actual_what_if_sha256}" != "${EXPECTED_WHAT_IF_SHA256}" ]]; then
            echo "Azure state or deployment inputs changed after the reviewed what-if. Start a new workflow run." >&2
            exit 1
          fi

      - name: Deploy reviewed immutable revision
        id: deploy
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.evidence.outputs.image_reference }}
          CONTAINER_REGISTRY_NAME: ${{ steps.evidence.outputs.registry_name }}
          RESOURCE_GROUP_LOCATION: ${{ steps.evidence.outputs.resource_group_location }}
          ENVIRONMENT_NAME: ${{ steps.evidence.outputs.environment_name }}
          SERVICE_NAME: ${{ steps.evidence.outputs.service_name }}
          TEMPLATE_PATH: ${{ steps.template.outputs.template_path }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          HELIOS_ENTRA_CLIENT_ID: ${{ vars.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_CLIENT_IDS: ${{ vars.HELIOS_ALLOWED_CLIENT_IDS }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ vars.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          COMMON_TAGS_JSON: ${{ needs.validate.outputs.common_tags_json }}
        run: |
          set -euo pipefail
          deployment_json="$(az deployment group create \
            --name "helios-cloud-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${TEMPLATE_PATH}" \
            --parameters \
              location="${RESOURCE_GROUP_LOCATION}" \
              environmentName="${ENVIRONMENT_NAME}" \
              serviceName="${SERVICE_NAME}" \
              containerImage="${IMAGE_REFERENCE}" \
              containerRegistryName="${CONTAINER_REGISTRY_NAME}" \
              allowPreviewPlaceholder=false \
              entraClientId="${HELIOS_ENTRA_CLIENT_ID}" \
              entraTenantId="${AZURE_TENANT_ID}" \
              allowedClientIds="${HELIOS_ALLOWED_CLIENT_IDS}" \
              allowedPrincipalObjectId="${HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID}" \
              sourceCommitSha="${GITHUB_SHA}" \
              commonTags="${COMMON_TAGS_JSON}" \
            --output json)"
          connector_url="$(jq -r '.properties.outputs.connectorUrl.value' <<<"${deployment_json}")"
          connector_application_id_uri="$(jq -r '.properties.outputs.connectorEntraApplicationIdUri.value' <<<"${deployment_json}")"
          if [[ ! "${connector_url}" =~ ^https://[^/]+$ ]]; then
            echo "Azure deployment did not return a valid HTTPS connector URL." >&2
            exit 1
          fi
          if [[ ! "${connector_application_id_uri}" =~ ^api://[0-9a-fA-F-]{36}$ ]]; then
            echo "Azure deployment did not return a valid Entra Application ID URI." >&2
            exit 1
          fi
          echo "connector_url=${connector_url}" >> "${GITHUB_OUTPUT}"
          echo "connector_scope=${connector_application_id_uri}/access_as_user" >> "${GITHUB_OUTPUT}"

      - name: Verify cloud health and fail-closed boundary
        shell: bash
        env:
          CONNECTOR_URL: ${{ steps.deploy.outputs.connector_url }}
          CONNECTOR_SCOPE: ${{ steps.deploy.outputs.connector_scope }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "${CONNECTOR_URL}/health/ready" > /dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "${ready}" != true ]]; then
            echo "The deployed connector did not become ready within two minutes." >&2
            exit 1
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${CONNECTOR_URL}/connector/context")"
          if [[ "${status}" != 401 ]]; then
            echo "Expected anonymous connector access to return 401; received ${status}." >&2
            exit 1
          fi
          application_id_uri="${CONNECTOR_SCOPE%/access_as_user}"
          if [[ ! "${application_id_uri}" =~ ^api://[0-9a-fA-F-]{36}$ ]]; then
            echo "The deployment did not return a valid Application ID URI for delegated scope validation." >&2
            exit 1
          fi
          audience_client_id="${application_id_uri#api://}"
          forged_principal="$(jq -cn \
            --arg audience "${audience_client_id}" \
            --arg azp '04b07795-8ddb-461a-bbee-02f9e1bf7b46' \
            '{claims: [{typ: "aud", val: $audience}, {typ: "scp", val: "access_as_user"}, {typ: "azp", val: $azp}]}' |
            base64 --wrap=0)"
          forged_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-MS-CLIENT-PRINCIPAL-ID: forged-untrusted-principal' \
            --header "X-MS-CLIENT-PRINCIPAL: ${forged_principal}" \
            "${CONNECTOR_URL}/connector/context")"
          if [[ "${forged_status}" != 401 ]]; then
            echo "The ingress did not strip a forged Easy Auth principal header; received ${forged_status}." >&2
            exit 1
          fi
          metadata="$(curl --fail --silent --show-error "${CONNECTOR_URL}/.well-known/oauth-protected-resource/mcp")"
          jq --exit-status \
            --arg resource "${CONNECTOR_URL}/mcp" \
            --arg scope "${CONNECTOR_SCOPE}" \
            '.resource == $resource and (.authorization_servers | length) >= 1 and .scopes_supported == [$scope]' \
            <<<"${metadata}" > /dev/null

          anonymous_tools_list_body="$(mktemp)"
          anonymous_tools_list_status="$(curl --silent --output "${anonymous_tools_list_body}" --write-out '%{http_code}' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "${CONNECTOR_URL}/mcp")"
          expected_tools='["search","fetch","helios_get_control_plane_status","helios_render_control_center","azure_get_context","azure_list_resources","azure_list_foundry_resources","helios_plan_automation","helios_propose_upgrade","helios_get_run","helios_list_connectors"]'
          if [[ "${anonymous_tools_list_status}" != 200 ]] ||
             ! jq --exit-status --argjson expectedTools "${expected_tools}" '
               .jsonrpc == "2.0" and
               .id == 1 and
               (.error | not) and
               (.result.tools | type == "array") and
               ((.result.tools | map(.name) | sort) == ($expectedTools | sort))
             ' "${anonymous_tools_list_body}" > /dev/null; then
            echo 'Anonymous MCP tools/list did not return the approved discovery tool inventory.' >&2
            exit 1
          fi

          anonymous_tools_call_body="$(mktemp)"
          anonymous_tools_call_status="$(curl --silent --output "${anonymous_tools_call_body}" --write-out '%{http_code}' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"azure_get_context","arguments":{}}}' \
            "${CONNECTOR_URL}/mcp")"
          if [[ "${anonymous_tools_call_status}" != 200 ]] ||
             ! jq --exit-status --arg scope "${CONNECTOR_SCOPE}" '
               .jsonrpc == "2.0" and
               .id == 2 and
               (.error | not) and
               .result.isError == true and
               (.result._meta["mcp/www_authenticate"] | type == "array") and
               (.result._meta["mcp/www_authenticate"] | length >= 1) and
               (.result._meta["mcp/www_authenticate"][0] | contains("resource_metadata=")) and
               (.result._meta["mcp/www_authenticate"][0] | contains("error=\"invalid_token\"")) and
               (.result._meta["mcp/www_authenticate"][0] | contains("scope=\"" + $scope + "\""))
             ' "${anonymous_tools_call_body}" > /dev/null; then
            echo 'Anonymous MCP tools/call did not return the expected RFC 9728 invalid_token delegated-scope challenge result.' >&2
            exit 1
          fi
          rm -f "${anonymous_tools_list_body}" "${anonymous_tools_call_body}"
