name: HELIOS Edge Automation Validation

on:
  pull_request:
    paths:
      - '.github/workflows/helios-edge-automation-validate.yml'
      - '.github/workflows/helios-cloud-deploy.yml'
      - 'monado/helios-control/config/edge-automation.json'
      - 'monado/helios-control/config/agent-core-policy.json'
      - 'monado/helios-control/config/agent-core-policy.schema.json'
      - 'monado/helios-control/config/identity-bindings.json'
      - 'monado/helios-control/config/integrations.json'
      - 'monado/helios-control/infra/**'
      - 'monado/helios-control/docs/EDGE_AUTOMATION.md'
      - 'monado/helios-control/appPackage/manifest.json'
      - 'monado/helios-control/config/agent-fabric.json'
      - 'monado/helios-control/docs/AGENT_AUTOFIX.md'
      - 'monado/helios-control/docs/AZURE_CONNECTOR_DEPLOYMENT.md'
      - 'monado/helios-control/docs/AZURE_INTERACTIVE_ONBOARDING.md'
      - 'monado/helios-control/connector/**'
      - 'monado/helios-control/src/Helios.Connect.Api/wwwroot/wizard/**'
      - 'monado/helios-control/scripts/Connect-HeliosAzureInteractive.ps1'
      - 'monado/helios-control/scripts/Invoke-HeliosEdgeAutomation.ps1'
      - 'monado/helios-control/scripts/Test-HeliosCloudConnection.ps1'
      - 'monado/helios-control/src/Helios.Connect.Api/**'
      - 'monado/helios-control/tests/Helios.Connect.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dotnet-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate automation manifest
        shell: bash
        run: |
          set -euo pipefail
          jq --exit-status '
            .schemaVersion == 1 and
            .defaultMode == "plan" and
            .mcp.canApplyFromMcp == false and
            .mcp.mutationToolsAllowed == false and
            (.mcp.exposedTools | sort) == ([
              "search",
              "fetch",
              "helios_get_control_plane_status",
              "helios_render_control_center",
              "azure_get_context",
              "azure_list_resources",
              "azure_list_foundry_resources",
              "helios_plan_automation",
              "helios_propose_upgrade",
              "helios_get_run",
              "helios_list_connectors"
            ] | sort) and
            .intents["repair-issue"].directMainWrite == false and
            .intents["repair-issue"].automaticMerge == false
          ' monado/helios-control/config/edge-automation.json > /dev/null
          jq --exit-status '
            .schemaVersion == 1 and
            .autoFix.createTaskBranch == false and
            .autoFix.openDraftPullRequest == false and
            .autoFix.runTests == false and
            .autoFix.directMainWrite == false and
            .autoFix.automaticMerge == false and
            .autoFix.automaticTenantAdminConsent == false and
            .learning.promotionRequiresPullRequest == true and
            .vault.rotation == "protected-workflow-only-disabled-until-approved-executor" and
            .vault.automaticReadback == false
          ' monado/helios-control/config/agent-fabric.json > /dev/null
          jq --exit-status '
            ([.bindings[] | select(.workload == "helios-api" and .scope == "selected-resource-group") | .roles[]] | index("Reader")) != null and
            ([.bindings[] | select(.workload == "helios-api" and .scope == "control-runs-container") | .roles[]] | index("Cosmos DB Built-in Data Contributor")) != null and
            .environmentPolicy.protectedDeployment == ["dev", "test", "prod"] and
            .environmentPolicy.planOnly == ["preview"]
          ' monado/helios-control/config/identity-bindings.json > /dev/null
          jq --exit-status '
            .schemaVersion == 2 and
            .agentCorePolicy.contract == "config/agent-core-policy.json" and
            .agentCorePolicy.schema == "config/agent-core-policy.schema.json" and
            .agentCorePolicy.enforcement == "fail-closed" and
            .routing[0].event == "helios.control-run.status" and
            .relayAuthentication.canonicalTuple == "unixTimestamp + newline + idempotencyKey + newline + exactJsonBody"
          ' monado/helios-control/config/integrations.json > /dev/null
          jq --exit-status '
            .schemaVersion == "1.0" and
            .lifecycle.initialState == "INIT" and
            (.lifecycle.states | index("AWAIT_APPROVAL")) != null and
            (.lifecycle.states | index("ROLLED_BACK")) != null and
            any(.lifecycle.transitions[]; .from == "INIT" and .to == "PRECHECK") and
            any(.lifecycle.transitions[]; .from == "PRECHECK" and .to == "PLAN") and
            any(.lifecycle.transitions[]; .from == "PLAN" and .to == "AWAIT_APPROVAL") and
            any(.lifecycle.transitions[]; .from == "NOTIFY" and .to == "COMPLETE") and
            .eventBus.delivery == "at-least-once-idempotent-consumers" and
            .rollback.automaticRollbackOnAgentError == false and
            .rollback.requiresGovernedRequest == true and
            .capabilities.denyByDefault == true and
            .capabilities.runtimeSelfEscalationAllowed == false and
            .sandboxing.reusableCredentialsExposedToAgents == false and
            .sandboxing.protectedBranchDirectPushAllowed == false and
            (.incident.suppression.neverSuppress | index("S0")) != null and
            (.incident.suppression.neverSuppress | index("S1")) != null
          ' monado/helios-control/config/agent-core-policy.json > /dev/null
          jq --exit-status '
            ."$schema" == "https://json-schema.org/draft/2020-12/schema" and
            .properties.lifecycle.type == "object" and
            .properties.rollback.type == "object" and
            .properties.audit.type == "object"
          ' monado/helios-control/config/agent-core-policy.schema.json > /dev/null
          jq --exit-status '
            .webApplicationInfo.resource == ("api://" + "$" + "{{ENTRA_APP_ID}}")
          ' monado/helios-control/appPackage/manifest.json > /dev/null
          grep -Fq 'var connectorApplicationIdUri = '\''api://${entraClientId}'\''' monado/helios-control/infra/connector.bicep
          grep -Fq 'allowedAudiences: [ entraClientId ]' monado/helios-control/infra/connector.bicep
          grep -Fq 'HELIOS_ALLOWED_CLIENT_IDS' monado/helios-control/infra/connector.bicep
          grep -Fq 'HELIOS_DEPLOY_ENABLED' monado/helios-control/infra/connector.bicep
          grep -Fq 'HELIOS_CONNECTOR_DELIVERY_ENABLED' monado/helios-control/infra/connector.bicep
          grep -Fq 'param enableOpenAiApiKeyBinding bool = false' monado/helios-control/infra/connector.bicep
          grep -Fq "secrets: enableOpenAiApiKeyBinding ? [" monado/helios-control/infra/connector.bicep
          grep -Fq "enableOpenAiApiKeyBinding ? [" monado/helios-control/infra/connector.bicep
          if grep -Fq "'Microsoft.Authorization/roleAssignments@2022-04-01'" monado/helios-control/infra/connector.bicep; then
            echo 'Connector template must not create Key Vault role assignments in CI deployments.' >&2
            exit 1
          fi

          cloud_workflow='.github/workflows/helios-cloud-deploy.yml'
          grep -Fq 'reviewedRunId' "${cloud_workflow}"
          if grep -Fq 'what-if.full.json' "${cloud_workflow}"; then
            echo 'The workflow must not upload unredacted what-if payloads as artifacts.' >&2
            exit 1
          fi
          grep -Fq 'enableOpenAiSecretBinding' "${cloud_workflow}"
          grep -Fq 'enableOpenAiApiKeyBinding=' "${cloud_workflow}"
          grep -Fq 'az acr repository update' "${cloud_workflow}"
          grep -Fq -- '--write-enabled false' "${cloud_workflow}"
          grep -Fq -- '--delete-enabled false' "${cloud_workflow}"
          grep -Fq 'HELIOS_ALLOWED_CLIENT_IDS contains invalid GUID value' "${cloud_workflow}"
          if [[ "$(grep -F -c 'commonTags="${COMMON_TAGS_JSON}"' "${cloud_workflow}")" -ne 3 ]]; then
            echo 'Canonical organization tags must be bound identically in preview, drift check, and deploy.' >&2
            exit 1
          fi
          if [[ "$(grep -F -c 'commonTags: $commonTags' "${cloud_workflow}")" -ne 2 ]]; then
            echo 'Organization tags must be locked into request creation and evidence verification.' >&2
            exit 1
          fi
          grep -Fq 'common_tags_sha256' "${cloud_workflow}"
          grep -Fq 'commonTagsSha256' "${cloud_workflow}"

          runtime='monado/helios-control/src/Helios.Connect.Api/Program.cs'
          verifier='monado/helios-control/scripts/Test-HeliosCloudConnection.ps1'
          openapi='monado/helios-control/connector/helios-azure-connector.openapi.yaml'
          mcp_manifest='monado/helios-control/connector/mcp-manifest.example.json'
          if rg -n 'user_impersonation' "${runtime}" "${verifier}" "${openapi}" "${mcp_manifest}"; then
            echo 'The retired user_impersonation scope must not reappear in the runtime or client contracts.' >&2
            exit 1
          fi
          grep -Fq 'HELIOS_ENTRA_APPLICATION_ID_URI' "${runtime}"
          grep -Fq '/access_as_user' "${runtime}"
          grep -Fq 'X-MS-CLIENT-PRINCIPAL' "${runtime}"
          grep -Fq 'Get-AzureCliAccessToken -DelegatedScope $script:delegatedScope' "${verifier}"
          grep -Fq "'X-MS-CLIENT-PRINCIPAL' = \$forgedPrincipal" "${verifier}"
          grep -Fq 'api://${ENTRA_CLIENT_ID}/access_as_user' "${openapi}"
          jq --exit-status '
            .version == "0.4.0" and
            .authentication.audience == ("api://" + "$" + "{ENTRA_CLIENT_ID}") and
            .authentication.scope == ("api://" + "$" + "{ENTRA_CLIENT_ID}/access_as_user") and
            .tools == [
              "search",
              "fetch",
              "helios_get_control_plane_status",
              "helios_render_control_center",
              "azure_get_context",
              "azure_list_resources",
              "azure_list_foundry_resources",
              "helios_plan_automation",
              "helios_propose_upgrade",
              "helios_get_run",
              "helios_list_connectors"
            ]
          ' "${mcp_manifest}" > /dev/null

          control_runs='monado/helios-control/src/Helios.Connect.Api/ControlRuns.cs'
          grep -Fq 'MaintainLeaseAsync' "${control_runs}"
          grep -Fq 'lease heartbeat lost ETag ownership' "${control_runs}"
          grep -Fq 'var occurredAt = run.CreatedAt;' "${control_runs}"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Test edge contracts
        shell: bash
        run: dotnet test monado/helios-control/Helios.Connect.sln --configuration Release

  validate-powershell-guardrails:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Parse and inspect edge automation
        shell: pwsh
        run: |
          $path = 'monado/helios-control/scripts/Invoke-HeliosEdgeAutomation.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $content = Get-Content $path -Raw
          foreach ($required in @("[ValidateSet('Diagnose', 'Plan')]", 'FullResourcePayloads', 'ContainerImage', 'sourceCommitSha', 'mutations = 0', 'protected-github-environment', 'second-environment-approval', 'applyAvailableLocally')) {
            if ($content -notmatch [regex]::Escape($required)) { throw "Missing guardrail: $required" }
          }
          foreach ($forbidden in @("'deployment', 'group', 'create'", "'keyvault', 'secret', 'set'", 'Read-Host', 'AsSecureString', 'ApprovedPlanSha256', 'ApprovedRequestSha256', 'Write-RestrictedSecretFile', '--mode Complete', 'ResourceIdOnly')) {
            if ($content -match [regex]::Escape($forbidden)) { throw "Forbidden local mutation path: $forbidden" }
          }
          $serviceWorker = Get-Content 'monado/helios-control/src/Helios.Connect.Api/wwwroot/wizard/sw.js' -Raw
          if ($serviceWorker -notmatch "cachePrefix = 'helios-control-wizard-'" -or
              $serviceWorker -notmatch 'startsWith\(cachePrefix\)' -or
              $serviceWorker -notmatch 'caches\.open\(cacheName\)') {
            throw 'Wizard cache cleanup and fallback must remain scoped to the wizard-owned cache.'
          }

          $onboardingPath = 'monado/helios-control/scripts/Connect-HeliosAzureInteractive.ps1'
          $onboardingTokens = $null
          $onboardingErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($onboardingPath, [ref]$onboardingTokens, [ref]$onboardingErrors)
          if ($onboardingErrors.Count -gt 0) { $onboardingErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $onboarding = Get-Content $onboardingPath -Raw
          foreach ($required in @('Ensure-GovernedResourceGroupEnvironmentTag', 'Assert-GovernedResourceGroupEnvironmentTag', "'tag', 'update'", "'--operation', 'Merge'", 'helios-environment', 'access_as_user', 'api://$($application.appId)', 'HELIOS_ALLOWED_CLIENT_IDS')) {
            if ($onboarding -notmatch [regex]::Escape($required)) { throw "Onboarding does not enforce resource-group governance: $required" }
          }
