name: HELIOS Deployment Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    name: Validate contracts and repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/integrations/validate_repository_integrity.py
      - run: python scripts/control/validate_automation_routes.py
      - run: python -m unittest discover -s scripts/control/tests -p 'test_*.py'

  validate-azure-tooling:
    name: Validate Azure tooling and Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: scripts/setup/verify-azure-cli.sh
      - run: az bicep build --file infra/azure/main.bicep --stdout >/dev/null

  readiness-summary:
    name: Deployment readiness summary
    if: always()
    needs: [validate-contracts, validate-azure-tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Report readiness
        env:
          AZURE_RESULT: ${{ needs.validate-azure-tooling.result }}
          CONTRACT_RESULT: ${{ needs.validate-contracts.result }}
        run: |
          {
            echo "## HELIOS deployment readiness"
            echo "- Contracts: ${CONTRACT_RESULT}"
            echo "- Azure tooling and Bicep: ${AZURE_RESULT}"
            echo "This workflow validates only; use Azure Infrastructure for what-if and approved deployment."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CONTRACT_RESULT" == "success" && "$AZURE_RESULT" == "success" ]]
