name: Status Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/status-dashboard.yml'

permissions:
  contents: read
  actions: read

jobs:
  collect-status:
    name: Collect Workflow Status
    runs-on: ubuntu-latest
    steps:
      - name: Build workflow status report
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const monitoredWorkflows = [
              'Multi-Repo Sync',
              'Component Version Check',
              'Build All Modules',
              'Build Variant Tests',
              'Code Registry Update'
            ];

            const { data: workflowData } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 200
            });

            const workflows = workflowData.workflows || [];
            const reportWorkflows = [];
            let completedRunsTotal = 0;
            let completedRunsSuccess = 0;

            for (const workflowName of monitoredWorkflows) {
              const workflow = workflows.find(item => item.name === workflowName);
              if (!workflow) {
                reportWorkflows.push({
                  name: workflowName,
                  status: 'not-found',
                  lastRunAt: null,
                  runCount: 0,
                  completedRunCount: 0,
                  successRate: null
                });
                continue;
              }

              const { data: runData } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 50
              });

              const runs = runData.workflow_runs || [];
              const completedRuns = runs.filter(run => run.status === 'completed');
              const successfulRuns = completedRuns.filter(run => run.conclusion === 'success');
              const latest = runs[0];
              const successRate = completedRuns.length > 0
                ? Number(((successfulRuns.length / completedRuns.length) * 100).toFixed(2))
                : null;

              completedRunsTotal += completedRuns.length;
              completedRunsSuccess += successfulRuns.length;

              reportWorkflows.push({
                name: workflowName,
                status: latest ? (latest.conclusion || latest.status) : 'no-runs',
                lastRunAt: latest ? latest.updated_at : null,
                runCount: runs.length,
                completedRunCount: completedRuns.length,
                successRate
              });
            }

            const overallSuccessRate = completedRunsTotal > 0
              ? Number(((completedRunsSuccess / completedRunsTotal) * 100).toFixed(2))
              : null;

            const report = {
              generatedAtUtc: new Date().toISOString(),
              repository: `${context.repo.owner}/${context.repo.repo}`,
              monitoredWorkflowCount: monitoredWorkflows.length,
              completedRunsTotal,
              completedRunsSuccess,
              overallSuccessRate,
              workflows: reportWorkflows
            };

            fs.writeFileSync('status-report.json', JSON.stringify(report, null, 2));

      - name: Upload status report artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: status-report.json
          retention-days: 30

  generate-dashboard:
    name: Generate Dashboard
    runs-on: ubuntu-latest
    needs: collect-status
    steps:
      - name: Download status report
        uses: actions/download-artifact@v4
        with:
          name: status-report
          path: status

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create dashboard markdown
        run: |
          python << 'PYTHON_EOF'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path("status/status-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))

          def format_time(value: str | None) -> str:
              if value is None:
                  return "n/a"
              return value.replace("T", " ").replace("Z", " UTC")

          lines = [
              "# HELIOS Platform CI/CD Status Dashboard",
              "",
              f"- Generated: `{datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}`",
              f"- Repository: `{report['repository']}`",
              f"- Monitored workflows: `{report['monitoredWorkflowCount']}`",
              f"- Completed runs sampled: `{report['completedRunsTotal']}`",
              f"- Overall success rate: `{report['overallSuccessRate'] if report['overallSuccessRate'] is not None else 'n/a'}%`",
              "",
              "## Workflow Status",
              "",
              "| Workflow | Latest Status | Last Run (UTC) | Completed Runs | Success Rate |",
              "| --- | --- | --- | ---: | ---: |",
          ]

          for workflow in report["workflows"]:
              success_rate = "n/a" if workflow["successRate"] is None else f"{workflow['successRate']}%"
              lines.append(
                  f"| {workflow['name']} | {workflow['status']} | {format_time(workflow['lastRunAt'])} | {workflow['completedRunCount']} | {success_rate} |"
              )

          output_dir = Path("status")
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "dashboard.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PYTHON_EOF

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-dashboard
          path: status/
          retention-days: 90

      - name: Publish dashboard summary
        run: cat status/dashboard.md >> "$GITHUB_STEP_SUMMARY"
