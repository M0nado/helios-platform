name: Build All Modules

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Skip dependency caches'
        required: false
        default: 'false'
      include_node_targets:
        description: 'Include optional Node.js module builds'
        required: false
        default: 'true'

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  discover-targets:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    outputs:
      dotnet_targets: ${{ steps.discover.outputs.dotnet_targets }}
      has_dotnet_targets: ${{ steps.discover.outputs.has_dotnet_targets }}
      node_targets: ${{ steps.discover.outputs.node_targets }}
      has_node_targets: ${{ steps.discover.outputs.has_node_targets }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover .NET and Node targets
        id: discover
        env:
          INCLUDE_NODE_TARGETS: ${{ github.event.inputs.include_node_targets || 'true' }}
        run: |
          set -euo pipefail

          DOTNET_TARGETS=$(
            {
              find . -maxdepth 4 -name "*.sln" \
                -not -path "./.git/*" \
                -not -path "./modules/*" \
                -not -path "./submodules/*"
            } | sed 's#^./##' | sort -u | jq -R 'select(length > 0)' | jq -cs .
          )
          DOTNET_COUNT=$(jq 'length' <<< "$DOTNET_TARGETS")
          if [ "$DOTNET_COUNT" -gt 0 ]; then
            HAS_DOTNET_TARGETS=true
          else
            HAS_DOTNET_TARGETS=false
          fi

          NODE_TARGETS='[]'
          if [ "$INCLUDE_NODE_TARGETS" = "true" ] && [ -f "plugins/openai/helios-mcp/package.json" ]; then
            NODE_TARGETS='["plugins/openai/helios-mcp"]'
          fi
          NODE_COUNT=$(jq 'length' <<< "$NODE_TARGETS")
          if [ "$NODE_COUNT" -gt 0 ]; then
            HAS_NODE_TARGETS=true
          else
            HAS_NODE_TARGETS=false
          fi

          echo "dotnet_targets=$DOTNET_TARGETS" >> "$GITHUB_OUTPUT"
          echo "has_dotnet_targets=$HAS_DOTNET_TARGETS" >> "$GITHUB_OUTPUT"
          echo "node_targets=$NODE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "has_node_targets=$HAS_NODE_TARGETS" >> "$GITHUB_OUTPUT"

          {
            echo "## Build Target Discovery"
            echo ""
            echo "- .NET targets: $DOTNET_COUNT"
            echo "- Node targets: $NODE_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

  build-dotnet-targets:
    name: Build .NET - ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: discover-targets
    if: needs.discover-targets.outputs.has_dotnet_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-targets.outputs.dotnet_targets) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare artifact metadata
        id: metadata
        run: |
          SAFE_NAME=$(echo "${{ matrix.target }}" | tr '/.' '-_')
          echo "artifact_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore NuGet cache
        if: github.event.inputs.clean_build != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore target dependencies
        run: dotnet restore "${{ matrix.target }}" -p:RestoreLockedMode=false

      - name: Build target
        run: dotnet build "${{ matrix.target }}" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test target
        run: |
          TARGET_NAME=$(echo "${{ matrix.target }}" | tr '/.' '__')
          mkdir -p artifacts/test-results
          if [[ "${{ matrix.target }}" == *.csproj ]] && [[ "$(basename "${{ matrix.target }}")" != *Test* ]]; then
            echo "Skipping dotnet test for non-test project target: ${{ matrix.target }}"
            exit 0
          fi
          dotnet test "${{ matrix.target }}" \
            --configuration Release \
            --no-build \
            -p:RestoreLockedMode=false \
            --results-directory artifacts/test-results \
            --logger "trx;LogFileName=${TARGET_NAME}.trx"

      - name: Upload .NET target artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-results-${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build-node-targets:
    name: Build Node - ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: discover-targets
    if: needs.discover-targets.outputs.has_node_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-targets.outputs.node_targets) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare artifact metadata
        id: metadata
        run: |
          SAFE_NAME=$(echo "${{ matrix.target }}" | tr '/.' '-_')
          echo "artifact_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          cd "${{ matrix.target }}"
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --no-audit
          fi

      - name: Lint, build, and test
        run: |
          cd "${{ matrix.target }}"
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present

      - name: Upload Node target artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-results-${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ matrix.target }}/dist/
            ${{ matrix.target }}/build/
            ${{ matrix.target }}/coverage/
          if-no-files-found: warn
          retention-days: 14

  verify-builds:
    name: Verify Build Results
    runs-on: ubuntu-latest
    if: always()
    needs:
      - discover-targets
      - build-dotnet-targets
      - build-node-targets
    steps:
      - name: Generate build summary
        run: |
          DOTNET_RESULT="${{ needs.build-dotnet-targets.result }}"
          NODE_RESULT="${{ needs.build-node-targets.result }}"
          HAS_DOTNET="${{ needs.discover-targets.outputs.has_dotnet_targets }}"
          HAS_NODE="${{ needs.discover-targets.outputs.has_node_targets }}"

          echo "## Build All Modules Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- .NET targets detected: $HAS_DOTNET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node targets detected: $HAS_NODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- .NET build result: $DOTNET_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node build result: $NODE_RESULT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_DOTNET" = "true" ] && [ "$DOTNET_RESULT" != "success" ]; then
            echo "One or more .NET targets failed."
            exit 1
          fi

          if [ "$HAS_NODE" = "true" ] && [ "$NODE_RESULT" != "success" ]; then
            echo "One or more Node targets failed."
            exit 1
          fi

          if [ "$HAS_DOTNET" != "true" ] && [ "$HAS_NODE" != "true" ]; then
            echo "No build targets discovered."
          fi

  report-pr-status:
    name: Report PR Build Status
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    needs: verify-builds
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.verify-builds.result }}' === 'success' ? '✅' : '❌';
            const body = [
              `## ${status} Build All Modules`,
              '',
              `- Workflow result: **${{ needs.verify-builds.result }}**`,
              `[View run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
