name: Pinned submodule integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout superproject without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Select submodule authentication mode
        id: auth-mode
        env:
          SUBMODULE_APP_ID: ${{ vars.SUBMODULE_APP_ID }}
          SUBMODULE_APP_PRIVATE_KEY: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$SUBMODULE_APP_ID" ] && [ -n "$SUBMODULE_APP_PRIVATE_KEY" ]; then
            echo "mode=scoped-token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=anonymous" >> "$GITHUB_OUTPUT"
            echo "Scoped submodule credentials are unavailable; attempting anonymous recursive checkout."
          fi

      - name: Create short-lived read-only installation token
        if: steps.auth-mode.outputs.mode == 'scoped-token'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: M0nado
          repositories: >-
            helios-monado-blade,helios-security-setup,helios-ai-hub,
            helios-dev-ai-hub,helios-build-agents,helios-gui-framework,
            helios-software-stack

      - name: Checkout exact recursive gitlinks
        if: steps.auth-mode.outputs.mode == 'scoped-token'
        env:
          SUBMODULE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          basic_auth="$(printf 'x-access-token:%s' "$SUBMODULE_TOKEN" | base64 -w 0)"
          echo "::add-mask::$basic_auth"
          git submodule sync --recursive
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" \
            submodule update --init --recursive

      - name: Checkout exact recursive gitlinks (anonymous)
        if: steps.auth-mode.outputs.mode == 'anonymous'
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Validate reviewed pins and repository integrity
        run: |
          git submodule status --recursive
          git ls-files --stage
          git diff --cached --submodule=log --check
          python3 scripts/integrations/validate_pinned_submodules.py
