name: Code Registry Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'monado/**'
      - 'plugins/**'
      - '.github/workflows/code-registry-update.yml'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Commit and push updated .registry artifacts'
        required: false
        default: 'false'
      compression_level:
        description: 'Gzip compression level (1-9)'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  build-registry:
    name: Build Registry Artifacts
    runs-on: ubuntu-latest
    outputs:
      snippets_count: ${{ steps.extract.outputs.snippets_count }}
      registry_hash: ${{ steps.extract.outputs.registry_hash }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract snippets from repository sources
        id: extract
        run: |
          python << 'PYTHON_EOF'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          SOURCE_ROOTS = [Path("src"), Path("scripts"), Path("monado"), Path("plugins")]
          EXTENSIONS = {".cs", ".fs", ".fsx", ".csproj", ".js", ".jsx", ".ts", ".tsx", ".ps1", ".py", ".json", ".yml", ".yaml"}
          EXCLUDED_SEGMENTS = {".git", "node_modules", "bin", "obj", ".registry", "artifacts"}

          def should_skip(path: Path) -> bool:
              return any(segment in EXCLUDED_SEGMENTS for segment in path.parts)

          snippets = []
          for source_root in SOURCE_ROOTS:
              if not source_root.exists():
                  continue
              for candidate in source_root.rglob("*"):
                  if not candidate.is_file() or candidate.suffix.lower() not in EXTENSIONS:
                      continue
                  if should_skip(candidate):
                      continue

                  relative_path = candidate.relative_to(ROOT).as_posix()
                  content = candidate.read_bytes()
                  content_hash = hashlib.sha256(content).hexdigest()
                  snippets.append(
                      {
                          "id": hashlib.sha256(relative_path.encode("utf-8")).hexdigest()[:16],
                          "path": relative_path,
                          "language": candidate.suffix.lower().lstrip("."),
                          "size": len(content),
                          "hash": content_hash,
                      }
                  )

          snippets.sort(key=lambda item: item["path"])
          registry_hash_source = "".join(item["hash"] for item in snippets).encode("utf-8")
          registry_hash = hashlib.sha256(registry_hash_source).hexdigest()

          Path(".registry").mkdir(parents=True, exist_ok=True)
          Path(".registry/snippets.json").write_text(json.dumps(snippets, indent=2) + "\n", encoding="utf-8")
          Path(".registry/index.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": "1.0",
                      "generatedAtUtc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "snippetsCount": len(snippets),
                      "registryHash": registry_hash,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"snippets_count={len(snippets)}\n")
              output.write(f"registry_hash={registry_hash}\n")
          PYTHON_EOF

      - name: Compress registry payload
        env:
          COMPRESSION_LEVEL: ${{ github.event.inputs.compression_level || '6' }}
        run: |
          mkdir -p .registry-compressed
          if ! [[ "$COMPRESSION_LEVEL" =~ ^[1-9]$ ]]; then
            echo "Invalid compression level '$COMPRESSION_LEVEL'. Use 1-9."
            exit 1
          fi

          tar -czf .registry-compressed/registry.tar.gz .registry
          gzip -"$COMPRESSION_LEVEL" -c .registry/snippets.json > .registry-compressed/snippets.json.gz

          python << 'PYTHON_EOF'
          import json
          from pathlib import Path

          original_size = sum(path.stat().st_size for path in Path(".registry").rglob("*") if path.is_file())
          compressed_size = sum(path.stat().st_size for path in Path(".registry-compressed").rglob("*") if path.is_file())
          compression_ratio = round((original_size / compressed_size), 3) if compressed_size else 0

          Path(".registry-compressed/compression-report.json").write_text(
              json.dumps(
                  {
                      "originalSizeBytes": original_size,
                      "compressedSizeBytes": compressed_size,
                      "compressionRatio": compression_ratio,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PYTHON_EOF

      - name: Upload registry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-registry
          path: |
            .registry/
            .registry-compressed/
          retention-days: 30

      - name: Publish registry summary
        run: |
          echo "## Code Registry Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snippets indexed: ${{ steps.extract.outputs.snippets_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry hash: \`${{ steps.extract.outputs.registry_hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply mode: ${{ github.event.inputs.apply_changes || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  publish-registry:
    name: Publish Registry Snapshot
    runs-on: ubuntu-latest
    needs: build-registry
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_changes == 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download registry artifacts
        uses: actions/download-artifact@v4
        with:
          name: code-registry
          path: registry-artifacts

      - name: Stage registry outputs
        run: |
          rm -rf .registry .registry-compressed
          cp -R registry-artifacts/.registry .registry
          cp -R registry-artifacts/.registry-compressed .registry-compressed

          cat > .registry/registry-metadata.json << EOF
          {
            "version": "1.0",
            "generatedAtUtc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "snippetsCount": ${{ needs.build-registry.outputs.snippets_count }},
            "registryHash": "${{ needs.build-registry.outputs.registry_hash }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Detect staged changes
        id: detect
        run: |
          git add .registry .registry-compressed
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit registry update
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.email "helios-registry@platform.local"
          git config user.name "HELIOS Registry Bot"
          git commit -m "chore: update code registry [skip ci]"

      - name: Push registry update
        if: steps.detect.outputs.has_changes == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish update summary
        run: |
          echo "## Code Registry Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changes committed: ${{ steps.detect.outputs.has_changes }}" >> "$GITHUB_STEP_SUMMARY"
