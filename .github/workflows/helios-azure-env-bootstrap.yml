name: helios-azure-env-bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate checks inputs only; apply writes GitHub environment settings
        required: true
        type: choice
        default: validate
        options:
          - validate
          - apply
      targetEnvironment:
        description: Target HELIOS environment set
        required: true
        type: choice
        default: azure-dev
        options:
          - azure-dev
          - azure-test
          - azure-prod
      requiredReviewerId:
        description: Numeric GitHub user ID required for protected-environment approvals
        required: true
        type: string
      githubDeploymentBranch:
        description: Branch allowed to deploy to the target protected environment
        required: true
        type: string
        default: main
      azureClientId:
        description: AZURE_CLIENT_ID (GitHub OIDC application client ID)
        required: false
        type: string
      azureTenantId:
        description: AZURE_TENANT_ID
        required: false
        type: string
      azureSubscriptionId:
        description: AZURE_SUBSCRIPTION_ID
        required: false
        type: string
      azureResourceGroup:
        description: AZURE_RESOURCE_GROUP
        required: false
        type: string
      heliosEntraClientId:
        description: HELIOS_ENTRA_CLIENT_ID (connector API app client ID)
        required: false
        type: string
      heliosAllowedPrincipalObjectId:
        description: HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID
        required: false
        type: string
      heliosContainerRegistryName:
        description: HELIOS_CONTAINER_REGISTRY_NAME
        required: false
        type: string
      heliosAzureConnectorUrl:
        description: Optional HELIOS_AZURE_CONNECTOR_URL (HTTPS origin without /mcp)
        required: false
        type: string
      azureDevopsOrganization:
        description: Optional AZURE_DEVOPS_ORGANIZATION
        required: false
        type: string
      repository:
        description: Repository to configure (owner/name)
        required: true
        type: string
        default: M0nado/helios-platform

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.mode == 'validate' }}
    name: Validate HELIOS GitHub environment metadata inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GH token source
        shell: pwsh
        env:
          HELIOS_REPO_ADMIN_TOKEN: ${{ secrets.HELIOS_REPO_ADMIN_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HELIOS_REPO_ADMIN_TOKEN)) {
            $selectedToken = $env:GITHUB_TOKEN_FALLBACK
          } else {
            $selectedToken = $env:HELIOS_REPO_ADMIN_TOKEN
          }
          if ([string]::IsNullOrWhiteSpace($selectedToken)) {
            throw 'No GitHub token is available for environment bootstrap validation.'
          }
          "GH_TOKEN=$selectedToken" >> $env:GITHUB_ENV

      - name: Validate HELIOS environment settings
        shell: pwsh
        env:
          HELIOS_INPUT_MODE: ${{ inputs.mode }}
          HELIOS_INPUT_TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          HELIOS_INPUT_REPOSITORY: ${{ inputs.repository }}
          HELIOS_INPUT_REQUIRED_REVIEWER_ID: ${{ inputs.requiredReviewerId }}
          HELIOS_INPUT_GITHUB_DEPLOYMENT_BRANCH: ${{ inputs.githubDeploymentBranch }}
          HELIOS_INPUT_AZURE_CLIENT_ID: ${{ inputs.azureClientId }}
          HELIOS_INPUT_AZURE_TENANT_ID: ${{ inputs.azureTenantId }}
          HELIOS_INPUT_AZURE_SUBSCRIPTION_ID: ${{ inputs.azureSubscriptionId }}
          HELIOS_INPUT_AZURE_RESOURCE_GROUP: ${{ inputs.azureResourceGroup }}
          HELIOS_INPUT_HELIOS_ENTRA_CLIENT_ID: ${{ inputs.heliosEntraClientId }}
          HELIOS_INPUT_HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ inputs.heliosAllowedPrincipalObjectId }}
          HELIOS_INPUT_HELIOS_CONTAINER_REGISTRY_NAME: ${{ inputs.heliosContainerRegistryName }}
          HELIOS_INPUT_HELIOS_AZURE_CONNECTOR_URL: ${{ inputs.heliosAzureConnectorUrl }}
          HELIOS_INPUT_AZURE_DEVOPS_ORGANIZATION: ${{ inputs.azureDevopsOrganization }}
          AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP_SECRET: ${{ secrets.AZURE_RESOURCE_GROUP }}
          HELIOS_ENTRA_CLIENT_ID_SECRET: ${{ secrets.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID_SECRET: ${{ secrets.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          HELIOS_CONTAINER_REGISTRY_NAME_SECRET: ${{ secrets.HELIOS_CONTAINER_REGISTRY_NAME }}
          HELIOS_AZURE_CONNECTOR_URL_SECRET: ${{ secrets.HELIOS_AZURE_CONNECTOR_URL }}
          AZURE_DEVOPS_ORGANIZATION_SECRET: ${{ secrets.AZURE_DEVOPS_ORGANIZATION }}
        run: |
          function Resolve-RequiredValue {
            param(
              [Parameter(Mandatory)][string]$Name,
              [AllowEmptyString()][string]$InputValue,
              [AllowEmptyString()][string]$SecretValue
            )

            if (-not [string]::IsNullOrWhiteSpace($InputValue)) {
              return $InputValue
            }
            if (-not [string]::IsNullOrWhiteSpace($SecretValue)) {
              return $SecretValue
            }
            throw "Missing required value '$Name'. Provide workflow input '$Name' or configure a secret with the same name."
          }

          function Resolve-OptionalValue {
            param(
              [AllowEmptyString()][string]$InputValue,
              [AllowEmptyString()][string]$SecretValue
            )

            if (-not [string]::IsNullOrWhiteSpace($InputValue)) {
              return $InputValue
            }
            if (-not [string]::IsNullOrWhiteSpace($SecretValue)) {
              return $SecretValue
            }
            return $null
          }

          $resolvedAzureClientId = Resolve-RequiredValue -Name 'AZURE_CLIENT_ID' -InputValue $env:HELIOS_INPUT_AZURE_CLIENT_ID -SecretValue $env:AZURE_CLIENT_ID_SECRET
          $resolvedAzureTenantId = Resolve-RequiredValue -Name 'AZURE_TENANT_ID' -InputValue $env:HELIOS_INPUT_AZURE_TENANT_ID -SecretValue $env:AZURE_TENANT_ID_SECRET
          $resolvedAzureSubscriptionId = Resolve-RequiredValue -Name 'AZURE_SUBSCRIPTION_ID' -InputValue $env:HELIOS_INPUT_AZURE_SUBSCRIPTION_ID -SecretValue $env:AZURE_SUBSCRIPTION_ID_SECRET
          $resolvedAzureResourceGroup = Resolve-RequiredValue -Name 'AZURE_RESOURCE_GROUP' -InputValue $env:HELIOS_INPUT_AZURE_RESOURCE_GROUP -SecretValue $env:AZURE_RESOURCE_GROUP_SECRET
          $resolvedHeliosEntraClientId = Resolve-RequiredValue -Name 'HELIOS_ENTRA_CLIENT_ID' -InputValue $env:HELIOS_INPUT_HELIOS_ENTRA_CLIENT_ID -SecretValue $env:HELIOS_ENTRA_CLIENT_ID_SECRET
          $resolvedAllowedPrincipalObjectId = Resolve-RequiredValue -Name 'HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID' -InputValue $env:HELIOS_INPUT_HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID -SecretValue $env:HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID_SECRET
          $resolvedContainerRegistryName = Resolve-RequiredValue -Name 'HELIOS_CONTAINER_REGISTRY_NAME' -InputValue $env:HELIOS_INPUT_HELIOS_CONTAINER_REGISTRY_NAME -SecretValue $env:HELIOS_CONTAINER_REGISTRY_NAME_SECRET
          $resolvedConnectorUrl = Resolve-OptionalValue -InputValue $env:HELIOS_INPUT_HELIOS_AZURE_CONNECTOR_URL -SecretValue $env:HELIOS_AZURE_CONNECTOR_URL_SECRET
          $resolvedDevOpsOrganization = Resolve-OptionalValue -InputValue $env:HELIOS_INPUT_AZURE_DEVOPS_ORGANIZATION -SecretValue $env:AZURE_DEVOPS_ORGANIZATION_SECRET

          $params = @{
            Mode = $env:HELIOS_INPUT_MODE
            TargetEnvironment = $env:HELIOS_INPUT_TARGET_ENVIRONMENT
            Repository = $env:HELIOS_INPUT_REPOSITORY
            RequiredReviewerId = $env:HELIOS_INPUT_REQUIRED_REVIEWER_ID
            GitHubDeploymentBranch = $env:HELIOS_INPUT_GITHUB_DEPLOYMENT_BRANCH
            AzureClientId = $resolvedAzureClientId
            AzureTenantId = $resolvedAzureTenantId
            AzureSubscriptionId = $resolvedAzureSubscriptionId
            AzureResourceGroup = $resolvedAzureResourceGroup
            HeliosEntraClientId = $resolvedHeliosEntraClientId
            HeliosAllowedPrincipalObjectId = $resolvedAllowedPrincipalObjectId
            HeliosContainerRegistryName = $resolvedContainerRegistryName
          }
          if (-not [string]::IsNullOrWhiteSpace($resolvedConnectorUrl)) {
            $params.HeliosAzureConnectorUrl = $resolvedConnectorUrl
          }
          if (-not [string]::IsNullOrWhiteSpace($resolvedDevOpsOrganization)) {
            $params.AzureDevOpsOrganization = $resolvedDevOpsOrganization
          }

          & ./monado/helios-control/scripts/Set-HeliosGitHubAzureEnvironment.ps1 @params

  apply:
    if: ${{ inputs.mode == 'apply' }}
    name: Apply HELIOS GitHub environment metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.targetEnvironment }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GH token source
        shell: pwsh
        env:
          HELIOS_REPO_ADMIN_TOKEN: ${{ secrets.HELIOS_REPO_ADMIN_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HELIOS_REPO_ADMIN_TOKEN)) {
            throw 'Apply mode requires HELIOS_REPO_ADMIN_TOKEN with repository administration scope.'
          }
          "GH_TOKEN=$env:HELIOS_REPO_ADMIN_TOKEN" >> $env:GITHUB_ENV

      - name: Require existing production approval gate
        if: ${{ inputs.targetEnvironment == 'azure-prod' }}
        shell: pwsh
        env:
          HELIOS_INPUT_REPOSITORY: ${{ inputs.repository }}
          HELIOS_INPUT_TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |
          $escapedEnvironment = [uri]::EscapeDataString($env:HELIOS_INPUT_TARGET_ENVIRONMENT)
          $rawDefinition = gh api `
            --method GET `
            --header "X-GitHub-Api-Version: 2022-11-28" `
            "repos/$($env:HELIOS_INPUT_REPOSITORY)/environments/$escapedEnvironment" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $detail = ($rawDefinition | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Unable to read GitHub environment '$($env:HELIOS_INPUT_TARGET_ENVIRONMENT)': $detail"
          }

          $definition = (($rawDefinition | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine) | ConvertFrom-Json -Depth 20
          $reviewerRules = @($definition.protection_rules | Where-Object type -eq 'required_reviewers')
          if ($reviewerRules.Count -lt 1 -or
              @($reviewerRules[0].reviewers).Count -lt 1 -or
              -not [bool] $reviewerRules[0].prevent_self_review -or
              -not [bool] $definition.deployment_branch_policy.custom_branch_policies -or
              [bool] $definition.deployment_branch_policy.protected_branches) {
            throw "Apply mode for azure-prod requires an already protected environment approval gate. Configure reviewer and custom branch policies before using this workflow."
          }

      - name: Apply HELIOS environment settings
        shell: pwsh
        env:
          HELIOS_INPUT_MODE: ${{ inputs.mode }}
          HELIOS_INPUT_TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          HELIOS_INPUT_REPOSITORY: ${{ inputs.repository }}
          HELIOS_INPUT_REQUIRED_REVIEWER_ID: ${{ inputs.requiredReviewerId }}
          HELIOS_INPUT_GITHUB_DEPLOYMENT_BRANCH: ${{ inputs.githubDeploymentBranch }}
          HELIOS_INPUT_AZURE_CLIENT_ID: ${{ inputs.azureClientId }}
          HELIOS_INPUT_AZURE_TENANT_ID: ${{ inputs.azureTenantId }}
          HELIOS_INPUT_AZURE_SUBSCRIPTION_ID: ${{ inputs.azureSubscriptionId }}
          HELIOS_INPUT_AZURE_RESOURCE_GROUP: ${{ inputs.azureResourceGroup }}
          HELIOS_INPUT_HELIOS_ENTRA_CLIENT_ID: ${{ inputs.heliosEntraClientId }}
          HELIOS_INPUT_HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID: ${{ inputs.heliosAllowedPrincipalObjectId }}
          HELIOS_INPUT_HELIOS_CONTAINER_REGISTRY_NAME: ${{ inputs.heliosContainerRegistryName }}
          HELIOS_INPUT_HELIOS_AZURE_CONNECTOR_URL: ${{ inputs.heliosAzureConnectorUrl }}
          HELIOS_INPUT_AZURE_DEVOPS_ORGANIZATION: ${{ inputs.azureDevopsOrganization }}
          AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_SECRET: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP_SECRET: ${{ secrets.AZURE_RESOURCE_GROUP }}
          HELIOS_ENTRA_CLIENT_ID_SECRET: ${{ secrets.HELIOS_ENTRA_CLIENT_ID }}
          HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID_SECRET: ${{ secrets.HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID }}
          HELIOS_CONTAINER_REGISTRY_NAME_SECRET: ${{ secrets.HELIOS_CONTAINER_REGISTRY_NAME }}
          HELIOS_AZURE_CONNECTOR_URL_SECRET: ${{ secrets.HELIOS_AZURE_CONNECTOR_URL }}
          AZURE_DEVOPS_ORGANIZATION_SECRET: ${{ secrets.AZURE_DEVOPS_ORGANIZATION }}
        run: |
          function Resolve-RequiredValue {
            param(
              [Parameter(Mandatory)][string]$Name,
              [AllowEmptyString()][string]$InputValue,
              [AllowEmptyString()][string]$SecretValue
            )

            if (-not [string]::IsNullOrWhiteSpace($InputValue)) {
              return $InputValue
            }
            if (-not [string]::IsNullOrWhiteSpace($SecretValue)) {
              return $SecretValue
            }
            throw "Missing required value '$Name'. Provide workflow input '$Name' or configure a secret with the same name."
          }

          function Resolve-OptionalValue {
            param(
              [AllowEmptyString()][string]$InputValue,
              [AllowEmptyString()][string]$SecretValue
            )

            if (-not [string]::IsNullOrWhiteSpace($InputValue)) {
              return $InputValue
            }
            if (-not [string]::IsNullOrWhiteSpace($SecretValue)) {
              return $SecretValue
            }
            return $null
          }

          $resolvedAzureClientId = Resolve-RequiredValue -Name 'AZURE_CLIENT_ID' -InputValue $env:HELIOS_INPUT_AZURE_CLIENT_ID -SecretValue $env:AZURE_CLIENT_ID_SECRET
          $resolvedAzureTenantId = Resolve-RequiredValue -Name 'AZURE_TENANT_ID' -InputValue $env:HELIOS_INPUT_AZURE_TENANT_ID -SecretValue $env:AZURE_TENANT_ID_SECRET
          $resolvedAzureSubscriptionId = Resolve-RequiredValue -Name 'AZURE_SUBSCRIPTION_ID' -InputValue $env:HELIOS_INPUT_AZURE_SUBSCRIPTION_ID -SecretValue $env:AZURE_SUBSCRIPTION_ID_SECRET
          $resolvedAzureResourceGroup = Resolve-RequiredValue -Name 'AZURE_RESOURCE_GROUP' -InputValue $env:HELIOS_INPUT_AZURE_RESOURCE_GROUP -SecretValue $env:AZURE_RESOURCE_GROUP_SECRET
          $resolvedHeliosEntraClientId = Resolve-RequiredValue -Name 'HELIOS_ENTRA_CLIENT_ID' -InputValue $env:HELIOS_INPUT_HELIOS_ENTRA_CLIENT_ID -SecretValue $env:HELIOS_ENTRA_CLIENT_ID_SECRET
          $resolvedAllowedPrincipalObjectId = Resolve-RequiredValue -Name 'HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID' -InputValue $env:HELIOS_INPUT_HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID -SecretValue $env:HELIOS_ALLOWED_PRINCIPAL_OBJECT_ID_SECRET
          $resolvedContainerRegistryName = Resolve-RequiredValue -Name 'HELIOS_CONTAINER_REGISTRY_NAME' -InputValue $env:HELIOS_INPUT_HELIOS_CONTAINER_REGISTRY_NAME -SecretValue $env:HELIOS_CONTAINER_REGISTRY_NAME_SECRET
          $resolvedConnectorUrl = Resolve-OptionalValue -InputValue $env:HELIOS_INPUT_HELIOS_AZURE_CONNECTOR_URL -SecretValue $env:HELIOS_AZURE_CONNECTOR_URL_SECRET
          $resolvedDevOpsOrganization = Resolve-OptionalValue -InputValue $env:HELIOS_INPUT_AZURE_DEVOPS_ORGANIZATION -SecretValue $env:AZURE_DEVOPS_ORGANIZATION_SECRET

          $params = @{
            Mode = $env:HELIOS_INPUT_MODE
            TargetEnvironment = $env:HELIOS_INPUT_TARGET_ENVIRONMENT
            Repository = $env:HELIOS_INPUT_REPOSITORY
            RequiredReviewerId = $env:HELIOS_INPUT_REQUIRED_REVIEWER_ID
            GitHubDeploymentBranch = $env:HELIOS_INPUT_GITHUB_DEPLOYMENT_BRANCH
            AzureClientId = $resolvedAzureClientId
            AzureTenantId = $resolvedAzureTenantId
            AzureSubscriptionId = $resolvedAzureSubscriptionId
            AzureResourceGroup = $resolvedAzureResourceGroup
            HeliosEntraClientId = $resolvedHeliosEntraClientId
            HeliosAllowedPrincipalObjectId = $resolvedAllowedPrincipalObjectId
            HeliosContainerRegistryName = $resolvedContainerRegistryName
          }
          if (-not [string]::IsNullOrWhiteSpace($resolvedConnectorUrl)) {
            $params.HeliosAzureConnectorUrl = $resolvedConnectorUrl
          }
          if (-not [string]::IsNullOrWhiteSpace($resolvedDevOpsOrganization)) {
            $params.AzureDevOpsOrganization = $resolvedDevOpsOrganization
          }

          & ./monado/helios-control/scripts/Set-HeliosGitHubAzureEnvironment.ps1 @params
