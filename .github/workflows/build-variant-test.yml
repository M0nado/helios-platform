name: Build Variant Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'monado/**'
      - '.github/workflows/build-variant-test.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Comma-separated variants (development,staging,production,test) or all'
        required: false
        default: 'all'

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup-variants:
    name: Setup Build Variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.setup.outputs.variants }}
      platforms: ${{ steps.setup.outputs.platforms }}
      linux_test_projects: ${{ steps.setup.outputs.linux_test_projects }}
      windows_test_projects: ${{ steps.setup.outputs.windows_test_projects }}
      has_tests: ${{ steps.setup.outputs.has_tests }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build variant and platform matrix
        id: setup
        env:
          SELECTED_VARIANTS: ${{ github.event.inputs.variants || 'all' }}
        run: |
          python << 'PYTHON_EOF'
          import json
          import os
          from pathlib import Path

          all_variants = [
              {
                  "name": "development",
                  "configuration": "Debug",
                  "dotnet_environment": "Development",
                  "ci_build": "false",
              },
              {
                  "name": "staging",
                  "configuration": "Release",
                  "dotnet_environment": "Staging",
                  "ci_build": "true",
              },
              {
                  "name": "production",
                  "configuration": "Release",
                  "dotnet_environment": "Production",
                  "ci_build": "true",
              },
              {
                  "name": "test",
                  "configuration": "Release",
                  "dotnet_environment": "Test",
                  "ci_build": "false",
              },
          ]

          selected = os.environ.get("SELECTED_VARIANTS", "all").strip().lower()
          if selected in {"", "all"}:
              variants = all_variants
          else:
              allow = {item.strip() for item in selected.split(",") if item.strip()}
              variants = [entry for entry in all_variants if entry["name"] in allow]
              if not variants:
                  raise SystemExit(
                      "No valid variants selected. Use: development,staging,production,test or all."
                  )

          platforms = [
              {"os": "ubuntu-latest"},
              {"os": "windows-latest"},
          ]

          linux_candidates = [
              "tests/analytics/HELIOS.Analytics.FSharp.Tests/HELIOS.Analytics.FSharp.Tests.fsproj",
          ]
          windows_candidates = [
              "tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj",
              "src/tests/HELIOS.Platform.Tests.csproj",
          ]

          linux_tests = [path for path in linux_candidates if Path(path).exists()]
          windows_tests = [path for path in windows_candidates if Path(path).exists()]
          has_tests = bool(linux_tests or windows_tests)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"variants={json.dumps(variants)}\n")
              output.write(f"platforms={json.dumps(platforms)}\n")
              output.write(f"linux_test_projects={json.dumps(linux_tests)}\n")
              output.write(f"windows_test_projects={json.dumps(windows_tests)}\n")
              output.write(f"has_tests={'true' if has_tests else 'false'}\n")
          PYTHON_EOF

  test-variants:
    name: Test ${{ matrix.variant.name }} on ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    needs: setup-variants
    if: needs.setup-variants.outputs.has_tests == 'true'
    strategy:
      matrix:
        variant: ${{ fromJson(needs.setup-variants.outputs.variants) }}
        platform: ${{ fromJson(needs.setup-variants.outputs.platforms) }}
      fail-fast: false
    env:
      DOTNET_ENVIRONMENT: ${{ matrix.variant.dotnet_environment }}
      HELIOS_BUILD_VARIANT: ${{ matrix.variant.name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run variant tests
        shell: pwsh
        run: |
          if ('${{ matrix.platform.os }}' -eq 'windows-latest') {
            $projects = '${{ needs.setup-variants.outputs.windows_test_projects }}' | ConvertFrom-Json
          } else {
            $projects = '${{ needs.setup-variants.outputs.linux_test_projects }}' | ConvertFrom-Json
          }

          if (-not $projects -or $projects.Count -eq 0) {
            Write-Host "No tests configured for this platform."
            exit 0
          }

          New-Item -Path test-results -ItemType Directory -Force | Out-Null
          foreach ($project in $projects) {
            $safeName = $project -replace '[\\/:.]', '_'
            $logName = "$safeName-${{ matrix.variant.name }}-${{ matrix.platform.os }}.trx"
            $args = @(
              'test',
              $project,
              '--configuration', '${{ matrix.variant.configuration }}',
              '--results-directory', 'test-results',
              '--logger', "trx;LogFileName=$logName",
              '--verbosity', 'minimal'
            )

            if ('${{ matrix.platform.os }}' -eq 'windows-latest' -and $project -like '*tests/HELIOS.Platform.Tests/HELIOS.Platform.Tests.csproj') {
              $args += @('--filter', 'FullyQualifiedName!~Integration&FullyQualifiedName!~Performance&FullyQualifiedName!~EndToEnd&FullyQualifiedName!~E2E&FullyQualifiedName!~Security&FullyQualifiedName!~Vault&FullyQualifiedName!~Driver&FullyQualifiedName!~Malware&FullyQualifiedName!~Deployment')
            }
            if ('${{ matrix.platform.os }}' -eq 'windows-latest' -and $project -like '*src/tests/HELIOS.Platform.Tests.csproj') {
              $args += @('--filter', 'FullyQualifiedName!~Integration')
            }
            if ('${{ matrix.variant.name }}' -eq 'test') {
              $args += @('--collect', 'XPlat Code Coverage')
            }

            dotnet @args
          }

      - name: Upload variant artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-${{ matrix.variant.name }}-${{ matrix.platform.os }}
          path: |
            test-results/
            **/TestResults/
          if-no-files-found: warn
          retention-days: 7

  compare-variants:
    name: Compare Build Variants
    runs-on: ubuntu-latest
    needs: [setup-variants, test-variants]
    if: always()
    steps:
      - name: Download all artifacts
        if: needs.test-variants.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          path: variant-artifacts

      - name: Setup Python
        if: needs.test-variants.result != 'skipped'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate comparison report
        run: |
          echo "## Build Variant Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test matrix status: ${{ needs.test-variants.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test-variants.result }}" = "skipped" ]; then
            echo "- No platform test projects were discovered." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python << 'PYTHON_EOF'
          from collections import Counter
          from pathlib import Path
          import re

          root = Path("variant-artifacts")
          counts = Counter()
          pattern = re.compile(r"-(development|staging|production|test)-")

          for trx_file in root.rglob("*.trx"):
              match = pattern.search(trx_file.name)
              if match:
                  counts[match.group(1)] += 1

          with Path("variant-summary.md").open("w", encoding="utf-8") as output:
              output.write("### Collected Test Result Files\n")
              output.write("| Variant | TRX files |\n")
              output.write("| --- | ---: |\n")
              for variant in ("development", "staging", "production", "test"):
                  output.write(f"| {variant} | {counts.get(variant, 0)} |\n")
          PYTHON_EOF

          cat variant-summary.md >> "$GITHUB_STEP_SUMMARY"

  report-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: [setup-variants, test-variants, compare-variants]
    if: always()
    steps:
      - name: Enforce variant test status
        run: |
          HAS_TESTS="${{ needs.setup-variants.outputs.has_tests }}"
          TEST_RESULT="${{ needs.test-variants.result }}"
          if [ "$HAS_TESTS" = "true" ] && [ "$TEST_RESULT" != "success" ]; then
            echo "Variant tests failed."
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.test-variants.result }}' === 'success' ? '✅' : '❌';
            const body = [
              `## ${status} Build Variant Tests`,
              '',
              `- Setup status: **${{ needs.setup-variants.result }}**`,
              `- Variant matrix status: **${{ needs.test-variants.result }}**`,
              `- Comparison status: **${{ needs.compare-variants.result }}**`,
              '',
              `[View detailed results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
