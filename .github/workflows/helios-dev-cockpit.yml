name: HELIOS Developer Cockpit

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.vscode/**'
      - '.mcp.json'
      - 'CLAUDE.md'
      - 'config/dev/**'
      - 'global.json'
      - 'docs/guides/HELIOS_DEVELOPER_COCKPIT.md'
      - 'scripts/dev/**'
      - 'plugins/helios-control-fabric/.mcp.json'
      - 'plugins/helios-control-fabric/.codex-plugin/plugin.json'
      - 'plugins/helios-control-fabric/assets/runner-topology.json'
      - 'plugins/helios-control-fabric/skills/helios-dev-cockpit/**'
      - '.github/workflows/helios-dev-cockpit.yml'
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.vscode/**'
      - '.mcp.json'
      - 'CLAUDE.md'
      - 'config/dev/**'
      - 'global.json'
      - 'scripts/dev/**'
      - 'plugins/helios-control-fabric/**'
      - '.github/workflows/helios-dev-cockpit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helios-dev-cockpit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  contract:
    name: Cockpit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up locked Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"

      - name: Validate configuration and tests
        shell: bash
        run: |
          bash scripts/dev/portable-validate.sh --contract-only
          npm audit \
            --prefix .devcontainer \
            --omit=dev \
            --audit-level=high

  devcontainer:
    name: Clean devcontainer bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up locked Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-locked cockpit tools
        shell: bash
        run: |
          npm ci \
            --prefix .devcontainer \
            --cache "${RUNNER_TEMP}/helios-npm" \
            --no-audit \
            --no-fund

      - name: Start clean developer cockpit
        shell: bash
        run: |
          .devcontainer/node_modules/.bin/devcontainer up \
            --workspace-folder .

      - name: Validate installed cockpit
        shell: bash
        run: |
          .devcontainer/node_modules/.bin/devcontainer exec \
            --workspace-folder . \
            bash -c \
            'export PATH="$PWD/.devcontainer/node_modules/.bin:$PATH"; python3 scripts/dev/helios_dev_doctor.py --profile devcontainer'
