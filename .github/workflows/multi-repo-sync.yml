name: Multi-Repo Sync

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Commit and push submodule updates (false = dry-run)'
        required: false
        default: 'false'
      target_ref:
        description: 'Optional branch or ref to sync'
        required: false
        default: ''
  push:
    branches:
      - main
      - develop
    paths:
      - '.gitmodules'
      - 'config/integrations/repositories.json'
      - 'scripts/validate_submodule_integrity.py'
      - 'tests/test_validate_submodule_integrity.py'
      - '.github/workflows/multi-repo-sync.yml'

permissions:
  contents: read

jobs:
  audit-submodule-integrity:
    name: Audit Submodule Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule repository map
        run: |
          python scripts/validate_submodule_integrity.py \
            --gitmodules .gitmodules \
            --repositories config/integrations/repositories.json \
            --json-out artifacts/submodule-integrity-report.json

      - name: Capture submodule state
        run: |
          mkdir -p artifacts
          git submodule status --recursive | tee artifacts/submodule-status.txt

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: submodule-integrity-audit
          path: artifacts/
          retention-days: 14

      - name: Publish audit summary
        run: |
          echo "## Submodule Integrity Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: ✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submodules: $(git config -f .gitmodules --get-regexp '^submodule\\..*\\.path$' | wc -l)" >> "$GITHUB_STEP_SUMMARY"

  sync-submodules:
    name: Sync Submodules
    if: github.event_name == 'workflow_dispatch'
    needs: audit-submodule-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_ref != '' && github.event.inputs.target_ref || github.ref }}
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Revalidate submodule mapping after sync
        run: |
          python scripts/validate_submodule_integrity.py \
            --gitmodules .gitmodules \
            --repositories config/integrations/repositories.json \
            --json-out artifacts/submodule-integrity-post-sync.json

      - name: Detect changed pointers
        id: detect
        run: |
          mkdir -p artifacts
          git status --short -- .gitmodules modules | tee artifacts/sync-diff.txt
          if [ -n "$(git status --porcelain -- .gitmodules modules)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated pointers
        if: steps.detect.outputs.changes_detected == 'true' && github.event.inputs.apply_changes == 'true'
        run: |
          git config user.email "helios-bot@platform.local"
          git config user.name "HELIOS Platform Bot"
          git add .gitmodules modules/
          git commit -m "chore: sync submodule pointers"

      - name: Push updated pointers
        if: steps.detect.outputs.changes_detected == 'true' && github.event.inputs.apply_changes == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report dry-run changes
        if: steps.detect.outputs.changes_detected == 'true' && github.event.inputs.apply_changes != 'true'
        run: |
          echo "::notice::Submodule updates detected. Re-run with apply_changes=true to commit and push."

      - name: Upload sync artifacts
        uses: actions/upload-artifact@v4
        with:
          name: submodule-sync-report
          path: artifacts/
          retention-days: 14

      - name: Publish sync summary
        run: |
          echo "## Submodule Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply mode: ${{ github.event.inputs.apply_changes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changes detected: ${{ steps.detect.outputs.changes_detected }}" >> "$GITHUB_STEP_SUMMARY"
