name: Multi-Repo Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.gitmodules'
      - 'config/integrations/repositories.json'
      - 'scripts/integrations/validate_repository_integrity.py'
      - '.github/workflows/multi-repo-sync.yml'

permissions:
  contents: read

jobs:
  sync-submodules:
    name: Sync Submodules
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout committed submodule pins
        run: |
          git submodule update --init --recursive --checkout

      - name: Validate repository integrity
        run: python scripts/integrations/validate_repository_integrity.py

      - name: Report Sync Status
        run: |
          echo "## Multi-Repo Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "**Submodule checkout**: committed pins applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Submodule Status" >> $GITHUB_STEP_SUMMARY
          echo "$(git submodule foreach 'echo "- $name"')" >> $GITHUB_STEP_SUMMARY

  audit-submodule-integrity:
    name: Audit Submodule Integrity
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify Submodule Hashes
        run: |
          echo "Verifying submodule integrity..."
          git submodule foreach 'echo "Submodule: $name" && git rev-parse HEAD'

      - name: Check for Conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "ERROR: Merge conflicts detected in submodules"
            exit 1
          fi
          echo "✓ No conflicts detected"

      - name: Validate .gitmodules
        run: |
          if git config -f .gitmodules --get-regexp path | grep -q .; then
            echo "✓ .gitmodules is valid"
          else
            echo "ERROR: .gitmodules validation failed"
            exit 1
          fi

      - name: Validate Repository Map
        run: python -m json.tool config/integrations/repositories.json > /dev/null

  validate-sync:
    name: Validate Sync Integrity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: sync-submodules
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify Submodule Hashes
        run: |
          echo "Verifying submodule integrity..."
          git submodule foreach 'echo "Submodule: $name" && git rev-parse HEAD'

      - name: Check for Conflicts
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "ERROR: Merge conflicts detected in submodules"
            exit 1
          fi
          echo "✓ No conflicts detected"

      - name: Validate .gitmodules
        run: |
          if git config -f .gitmodules --get-regexp path | wc -l | grep -q .; then
            echo "✓ .gitmodules is valid"
          else
            echo "ERROR: .gitmodules validation failed"
            exit 1
          fi
