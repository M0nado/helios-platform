name: Repository Declaration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.gitmodules'
      - 'config/integrations/repositories.json'
      - 'scripts/integrations/validate_repository_integrity.py'
      - 'tests/test_repository_integrity.py'
      - '.github/workflows/multi-repo-sync.yml'

permissions:
  contents: read

jobs:
  audit-declarations:
    name: Audit Repository Declarations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate approved repository declarations
        run: python scripts/integrations/validate_repository_integrity.py --declarations-only

      - name: Report audit status
        run: |
          echo "## Repository Declaration Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "Registry and .gitmodules declarations are consistent." >> $GITHUB_STEP_SUMMARY
