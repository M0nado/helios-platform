name: Knowledge discovery contracts

on:
  pull_request:
    paths:
      - "config/aihub-language-skill-profiles.json"
      - "config/capabilities/**"
      - "llms.txt"
      - "scripts/knowledge/**"
      - "tests/test_knowledge_discovery.py"
      - ".github/workflows/knowledge-discovery.yml"
  push:
    branches: [main]
    paths:
      - "config/aihub-language-skill-profiles.json"
      - "config/capabilities/**"
      - "llms.txt"
      - "scripts/knowledge/**"
      - "tests/test_knowledge_discovery.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated discovery document
        run: python3 scripts/knowledge/generate_llms_txt.py --check
      - name: Validate capability backlog
        run: python3 scripts/knowledge/validate_capabilities.py
      - name: Preview deterministic issue plan
        run: python3 scripts/knowledge/plan_capability_issues.py
      - name: Run knowledge contract tests
        run: python3 -m unittest tests/test_knowledge_discovery.py
