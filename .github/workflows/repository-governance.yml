name: Repository governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    paths:
      - config/repository-backlog.json
      - config/repository-governance.json
      - scripts/github/sync_repository_backlog.py
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/repository-governance.yml

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and backlog invariants
        run: |
          python -m json.tool config/repository-governance.json >/dev/null
          python -m json.tool config/repository-backlog.json >/dev/null
          python scripts/github/sync_repository_backlog.py
      - name: Enforce pull request routing
        if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os, re, sys
          head, base, body = os.environ['HEAD'], os.environ['BASE'], os.environ.get('BODY', '')
          prefixes = ('feature/', 'fix/', 'chore/', 'docs/', 'hotfix/', 'integration/')
          if not head.startswith(prefixes):
              sys.exit(f"Unsupported branch name: {head}")
          if base == 'main' and not (head.startswith('integration/') or head.startswith('hotfix/')):
              sys.exit('Only integration lanes and approved hotfixes may target main')
          if not re.search(r'(?i)(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+', body):
              sys.exit('PR body must close one scoped issue')
          PY
