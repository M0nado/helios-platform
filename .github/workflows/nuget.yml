name: NuGet Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - 'src/core/HELIOS.Platform/**'
      - 'src/tests/**'
      - 'Directory.Build.props'
      - '.github/workflows/nuget.yml'
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish the validated package to NuGet.org'
        required: false
        default: false
        type: boolean
      publish_github:
        description: 'Publish the validated package to GitHub Packages'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet-version: ['8.0', '7.0', '6.0']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: |
          dotnet restore src/core/HELIOS.Platform/HELIOS.Platform.csproj --locked-mode
          dotnet restore tests/SecurityValidationTests.csproj
          dotnet restore monado/helios-control/tests/Helios.Connect.Tests/Helios.Connect.Tests.csproj

      - name: Build solution
        run: dotnet build src/core/HELIOS.Platform/HELIOS.Platform.csproj -c Release --no-restore -v minimal

      - name: Run tests
        run: |
          dotnet test tests/SecurityValidationTests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --verbosity minimal
          dotnet test monado/helios-control/tests/Helios.Connect.Tests/Helios.Connect.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.dotnet-version }}
          path: '**/test-results.trx'

  package:
    needs: build
    runs-on: windows-latest
    if: needs.build.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "src/core/HELIOS.Platform/HELIOS.Platform.csproj"
          $version = ([string]$csproj.Project.PropertyGroup.Version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: '$version'"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Restore and Build
        run: |
          dotnet restore src/core/HELIOS.Platform/HELIOS.Platform.csproj --locked-mode
          dotnet pack src/core/HELIOS.Platform/HELIOS.Platform.csproj -c Release -o ./artifacts/ --no-restore -p:IsPackable=true

      - name: Verify package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./artifacts/*.nupkg)
          if ($packages.Count -eq 0) { throw 'No NuGet package was produced.' }
          foreach ($package in $packages) {
            Write-Host "Package created: $($package.Name)"
            Write-Host "Size: $(($package.Length / 1MB).ToString('F2')) MB"
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package-${{ steps.version.outputs.VERSION }}
          path: artifacts/*.nupkg
          retention-days: 30

  publish-nuget:
    needs: package
    runs-on: windows-latest
    if: needs.package.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget))
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nuget-package-*
          path: download/
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0'

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NUGET_API_KEY is required for an explicitly authorized NuGet publication.'
          }
          $packages = @(Get-ChildItem download -Recurse -Filter '*.nupkg')
          if ($packages.Count -eq 0) { throw 'No NuGet package artifact was downloaded.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" download/*.nupkg `
            --repo "${{ github.repository }}" `
            --title "Release ${{ github.ref_name }}" `
            --notes-file CHANGELOG.md `
            ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') && '--prerelease' || '' }}

  publish-github:
    needs: package
    runs-on: windows-latest
    if: needs.package.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nuget-package-*
          path: download/
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0'

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem download -Recurse -Filter '*.nupkg')
          if ($packages.Count -eq 0) { throw 'No NuGet package artifact was downloaded.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:GITHUB_PACKAGES_TOKEN `
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
              --skip-duplicate
          }
