trigger:
  branches:
    include:
    - main
    - copilot/*

pr:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-24.04

variables:
  HELIOS_DOTNET_SDK_VERSION: 8.0.423
  HELIOS_BICEP_VERSION: v0.43.8

steps:
- checkout: self
  clean: true
  fetchDepth: 0

- task: UseDotNet@2
  displayName: Use pinned .NET SDK
  inputs:
    packageType: sdk
    version: $(HELIOS_DOTNET_SDK_VERSION)

- script: |
    set -euo pipefail
    if [[ -f "Helios.Connect.sln" ]]; then
      project_dir="."
    elif [[ -f "monado/helios-control/Helios.Connect.sln" ]]; then
      project_dir="monado/helios-control"
    else
      echo "##vso[task.logissue type=error]Helios.Connect.sln was not found."
      exit 1
    fi
    echo "Detected project directory: ${project_dir}"
    echo "##vso[task.setvariable variable=projectDirectory]${project_dir}"
  displayName: Locate Helios control project

- script: dotnet restore "$(projectDirectory)/Helios.Connect.sln"
  displayName: Restore Helios dependencies

- script: |
    dotnet test "$(projectDirectory)/Helios.Connect.sln" \
      --configuration Release \
      --no-restore \
      --logger "trx;LogFileName=helios-connect-tests.trx" \
      --results-directory "$(Agent.TempDirectory)/test-results"
  displayName: Run Helios test suite

- task: PublishTestResults@2
  displayName: Publish test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: "$(Agent.TempDirectory)/test-results/**/*.trx"
    testRunTitle: Helios Connect tests
    failTaskOnFailedTests: true

- script: |
    set -euo pipefail
    az bicep install --version "$(HELIOS_BICEP_VERSION)"
    az bicep version
    az bicep build --file "$(projectDirectory)/infra/connector.bicep"
  displayName: Compile pinned connector Bicep template

- pwsh: |
    Set-StrictMode -Version Latest
    $projectDirectory = "$(projectDirectory)"
    if ([string]::IsNullOrWhiteSpace($projectDirectory)) {
      throw 'projectDirectory variable is required.'
    }
    Push-Location $projectDirectory
    try {
      ./scripts/New-HeliosTeamsPackage.ps1
    }
    finally {
      Pop-Location
    }
  displayName: Materialize Teams package icons

- script: |
    set -euo pipefail
    cd "$(projectDirectory)"
    python3 - <<'PY'
    import json
    import struct
    from pathlib import Path

    root = Path("appPackage")
    manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
    if manifest["version"] != "0.6.0":
        raise AssertionError("Unexpected appPackage/manifest.json version.")
    expected_resource = "api://" + "$" + "{{PUBLIC_HOSTNAME}}/" + "$" + "{{ENTRA_APP_ID}}"
    if manifest["webApplicationInfo"]["resource"] != expected_resource:
        raise AssertionError("Unexpected webApplicationInfo.resource placeholder.")
    for name, expected in (("color.png", (192, 192)), ("outline.png", (32, 32))):
        data = (root / name).read_bytes()
        if data[:8] != b"\x89PNG\r\n\x1a\n":
            raise AssertionError(f"{name} is not a valid PNG.")
        if struct.unpack(">II", data[16:24]) != expected:
            raise AssertionError(f"{name} dimensions do not match expected size {expected}.")
    PY
  displayName: Validate Copilot package contract
