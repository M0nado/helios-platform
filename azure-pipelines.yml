# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - main
    - copilot/*

pr:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  clean: true
  submodules: false
  fetchDepth: 1

- script: |
    echo "Azure pipeline smoke validation"
    git --version
    dotnet --info || true
  displayName: 'Run smoke validation'
