# HELIOS Azure DevOps CI pipeline
# Safe-by-default: validates source changes and runs scoped build/tests only.
# No deployment/apply actions are performed from this pipeline.

trigger:
  branches:
    include:
      - main
      - develop
      - copilot/*
      - codex/*
  paths:
    include:
      - azure-pipelines.yml
      - nuget.config
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - eng/test/**
      - config/integrations/event-contract.schema.json
      - src/core/HELIOS.Platform/**
      - src/core/HELIOS.Platform.Contracts/**
      - monado/helios-control/src/**
      - monado/helios-control/tests/**
      - monado/helios-control/Helios.Connect.sln
    exclude:
      - docs/**
      - '**/*.md'
      - src/core/HELIOS.Platform/**/Tests/**
      - src/core/HELIOS.Platform/**/*Tests.cs

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - azure-pipelines.yml
      - nuget.config
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - eng/test/**
      - config/integrations/event-contract.schema.json
      - src/core/HELIOS.Platform/**
      - src/core/HELIOS.Platform.Contracts/**
      - monado/helios-control/src/**
      - monado/helios-control/tests/**
      - monado/helios-control/Helios.Connect.sln
    exclude:
      - docs/**
      - '**/*.md'
      - src/core/HELIOS.Platform/**/Tests/**
      - src/core/HELIOS.Platform/**/*Tests.cs

variables:
  buildConfiguration: Release
  appProject: src/core/HELIOS.Platform/HELIOS.Platform.csproj
  usersTestProject: src/core/HELIOS.Platform/Phase10/Users/Tests/HELIOS.Platform.Phase10.Users.Tests.csproj
  connectTestsProject: monado/helios-control/tests/Helios.Connect.Tests/Helios.Connect.Tests.csproj
  publicNuGetFeed: https://api.nuget.org/v3/index.json
  nugetPackages: $(Pipeline.Workspace)\.nuget\packages
  testResultsDir: $(Agent.TempDirectory)\test-results

stages:
  - stage: Preflight
    displayName: Preflight validation
    jobs:
      - job: ContractAndOwnershipChecks
        displayName: Validate integration contract and test ownership
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: '3.12'

          - script: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check --quiet "jsonschema==4.23.0"
              python - <<'PY'
              import json
              from jsonschema.validators import Draft202012Validator
              with open("config/integrations/event-contract.schema.json", encoding="utf-8") as schema_file:
                  schema = json.load(schema_file)
              Draft202012Validator.check_schema(schema)
              PY
              python eng/test/validate_test_ownership.py
            displayName: Validate schema and test ownership manifest

  - stage: BuildAndTest
    displayName: Build and test
    dependsOn: Preflight
    condition: succeeded()
    jobs:
      - job: WindowsBuild
        displayName: Build Windows targets and run scoped tests
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - task: Cache@2
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | global.json | Directory.Packages.props | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)" | global.json
                nuget | "$(Agent.OS)"
              path: $(nugetPackages)

          - powershell: dotnet --info
            displayName: Show .NET environment

          - powershell: dotnet restore "$(appProject)" --source "$(publicNuGetFeed)" -p:ContinuousIntegrationBuild=true
            displayName: Restore HELIOS.Platform
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - powershell: dotnet restore "$(usersTestProject)" --source "$(publicNuGetFeed)" -p:ContinuousIntegrationBuild=true
            displayName: Restore users test project
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - powershell: dotnet restore "$(connectTestsProject)" --source "$(publicNuGetFeed)" -p:ContinuousIntegrationBuild=true
            displayName: Restore Helios.Connect tests
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - powershell: dotnet build "$(appProject)" --configuration "$(buildConfiguration)" --no-restore -p:ContinuousIntegrationBuild=true
            displayName: Build HELIOS.Platform
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - powershell: dotnet build "$(usersTestProject)" --configuration "$(buildConfiguration)" --no-restore -p:ContinuousIntegrationBuild=true
            displayName: Compile users tests (no execution in ungated CI)
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - powershell: New-Item -ItemType Directory -Force -Path "$(testResultsDir)" | Out-Null
            displayName: Create test results directory

          - powershell: dotnet test "$(connectTestsProject)" --configuration "$(buildConfiguration)" --no-restore --logger "trx;LogFileName=helios-connect.trx" --results-directory "$(testResultsDir)" -p:ContinuousIntegrationBuild=true
            displayName: Run Helios.Connect tests
            env:
              NUGET_PACKAGES: $(nugetPackages)

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testRunner: VSTest
              testResultsFiles: '*.trx'
              searchFolder: '$(testResultsDir)'
              mergeTestResults: true
              failTaskOnFailedTests: true
              testRunTitle: 'HELIOS scoped test suites'

          - task: PublishBuildArtifacts@1
            displayName: Publish test artifacts
            condition: always()
            inputs:
              PathtoPublish: '$(testResultsDir)'
              ArtifactName: 'test-results'
              publishLocation: 'Container'
