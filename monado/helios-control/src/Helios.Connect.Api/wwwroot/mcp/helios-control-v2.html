<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monado Control Center</title>
  <style>
    :root{color-scheme:dark;--ink:#e9fbff;--muted:#92aeba;--cyan:#55e5ff;--green:#66ffb3;--amber:#ffc857;--red:#ff6b7a;--panel:#0a1526}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#11365a 0,#07101d 42%,#03070d 100%);color:var(--ink);font:14px Inter,system-ui,sans-serif}
    main{max-width:920px;margin:auto;padding:24px}.eyebrow{color:var(--cyan);letter-spacing:.16em;text-transform:uppercase}.head{display:flex;align-items:end;justify-content:space-between;gap:16px}h1{margin:.25em 0;font-size:clamp(28px,6vw,50px)}
    button{border:1px solid #2fa4c1;background:#0c2b3c;color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
    .card{min-height:155px;padding:16px;border:1px solid #193d53;border-radius:16px;background:linear-gradient(145deg,#0d1b30dd,#08111ddd);box-shadow:0 15px 45px #0006}.name{font-size:18px;font-weight:750}
    .state{display:inline-block;margin:12px 0 8px;border-radius:99px;padding:4px 9px;font-size:12px;background:#ffffff10}.connected,.configured{color:var(--green)}.needs_configuration{color:var(--amber)}.blocked{color:var(--red)}.muted{color:var(--muted);line-height:1.4}a{color:var(--cyan)}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><div class="eyebrow">HELIOS · HERMES XCORE</div><h1>Monado Control Center</h1></div>
    <button id="refresh" type="button">Refresh snapshot</button>
  </div>
  <p class="muted" id="stamp">Waiting for governed control-plane data…</p>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<script>
  const grid=document.getElementById("grid");
  const stamp=document.getElementById("stamp");
  const pending=new Map();
  const approvedRedirectOrigins=new Set([
    "https://github.com",
    "https://helios-cloud-control.thepatman64.chatgpt.site",
    "https://heli0s-my.sharepoint.com",
    "https://helios-xk97943.slack.com",
    "https://linear.app"
  ]);
  let requestId=0;
  let bridgeReady=false;

  function node(tag,className,text){
    const value=document.createElement(tag);
    if(className)value.className=className;
    if(text!==undefined)value.textContent=String(text);
    return value;
  }

  function safeHttpsUrl(value){
    try{
      const url=new URL(value);
      return url.protocol==="https:"&&approvedRedirectOrigins.has(url.origin)?url.href:null;
    }catch{return null}
  }

  function sendNotification(method,params={}){
    window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
  }

  function sendRequest(method,params={},timeoutMs=30000){
    const id=++requestId;
    window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{
        pending.delete(id);
        reject(new Error("MCP Apps host did not respond."));
      },timeoutMs);
      pending.set(id,{resolve,reject,timer});
    });
  }

  async function initializeBridge(){
    await sendRequest("ui/initialize",{
      protocolVersion:"2026-01-26",
      appCapabilities:{availableDisplayModes:["inline","fullscreen"]},
      appInfo:{name:"helios-monado-control-center",version:"0.6.0"}
    },10000);
    bridgeReady=true;
    sendNotification("ui/notifications/initialized");
    return true;
  }

  function render(data){
    const systems=Array.isArray(data?.systems)?data.systems:[];
    stamp.textContent=`Fabric ${data?.version||""} · ${data?.source||"snapshot"} · ${data?.generatedAt||"ready"}`;
    grid.replaceChildren();
    for(const system of systems){
      const state=["connected","configured","needs_configuration","blocked"].includes(system?.state)?system.state:"needs_configuration";
      const card=node("article","card");
      card.append(node("div","name",system?.name||"Unknown system"));
      card.append(node("div",`state ${state}`,state.replaceAll("_"," ")));
      card.append(node("div","muted",system?.purpose||""));
      card.append(node("p","muted",system?.nextAction||""));
      const href=safeHttpsUrl(system?.url);
      if(href){
        const link=node("a","","Open authority ↗");
        link.href=href;link.rel="noreferrer";
        link.addEventListener("click",event=>{
          event.preventDefault();
          void openAuthority(href);
        });
        card.append(link);
      }
      grid.append(card);
    }
  }

  async function callTool(name,args={}){
    if(bridgeReady)return sendRequest("tools/call",{name,arguments:args});
    await bridgeInitialization;
    if(bridgeReady)return sendRequest("tools/call",{name,arguments:args});
    if(window.openai?.callTool)return window.openai.callTool(name,args);
    throw new Error("This host does not expose an MCP Apps tool bridge.");
  }

  async function openAuthority(href){
    const approved=safeHttpsUrl(href);
    if(!approved){
      stamp.textContent="This authority URL is not approved by the widget navigation policy.";
      return;
    }
    try{
      if(bridgeReady){
        await sendRequest("ui/open-link",{url:approved});
        return;
      }
      await bridgeInitialization;
      if(bridgeReady){
        await sendRequest("ui/open-link",{url:approved});
        return;
      }
      if(window.openai?.openExternal){
        await window.openai.openExternal({href:approved});
        return;
      }
      throw new Error("This host does not expose approved link navigation.");
    }catch(error){
      stamp.textContent=error instanceof Error?error.message:"The host declined this link.";
    }
  }

  window.addEventListener("message",event=>{
    if(event.source!==window.parent)return;
    const message=event.data;
    if(message?.jsonrpc!=="2.0")return;
    if(message.method==="ui/notifications/tool-result"){
      render(message.params?.structuredContent);
      return;
    }
    if(message.method==="ui/resource-teardown"&&message.id!==undefined){
      window.parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");
      return;
    }
    if(!pending.has(message.id))return;
    const waiter=pending.get(message.id);
    pending.delete(message.id);
    clearTimeout(waiter.timer);
    if(message.error)waiter.reject(new Error(message.error.message||"MCP tool call failed"));
    else waiter.resolve(message.result);
  });

  const bridgeInitialization=initializeBridge().catch(()=>false);
  if(window.openai?.toolOutput)render(window.openai.toolOutput);
  document.getElementById("refresh").addEventListener("click",async()=>{
    try{
      const result=await callTool("helios_get_control_plane_status",{});
      render(result?.structuredContent||result);
    }catch(error){
      stamp.textContent=error instanceof Error?error.message:"Refresh failed";
    }
  });
  new ResizeObserver(entries=>{
    if(!bridgeReady||entries.length===0)return;
    const rect=entries[0].contentRect;
    sendNotification("ui/notifications/size-changed",{
      width:Math.ceil(rect.width),
      height:Math.ceil(rect.height)
    });
  }).observe(document.documentElement);
</script>
</body>
</html>
